<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SO Analytics">
<title>SO Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html{font-size:16px;height:100%;-webkit-text-size-adjust:100%}
body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Arial,sans-serif;overflow:hidden;background:var(--bg)}

:root{
  --bg:#f2f2f7;--surface:#fff;
  --s2:rgba(118,118,128,.12);--s3:rgba(118,118,128,.07);
  --border:rgba(60,60,67,.13);--b2:rgba(60,60,67,.07);
  --text:#1c1c1e;--t2:#3a3a3c;--t3:#6d6d72;--t4:#aeaeb2;
  --blue:#007aff;--bl:rgba(0,122,255,.1);
  --green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;
  --sh:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --hh:56px;--bnh:80px;--bbh:52px;
  /* header bg as separate var — updated by JS on toggle */
  --hbg-light:rgba(242,242,247,.95);
  --hbg-dark:rgba(28,28,30,.96);
  --nbg-light:rgba(248,248,252,.97);
  --nbg-dark:rgba(28,28,30,.97);
}
body.dark{
  --bg:#1c1c1e;--surface:#2c2c2e;
  --s2:rgba(255,255,255,.1);--s3:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.15);--b2:rgba(255,255,255,.08);
  --text:#f2f2f7;--t2:#ebebf5;--t3:#aeaeb2;--t4:#636366;
  --sh:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
}

/* ── SPLASH ── */
.splash{
  position:fixed;inset:0;z-index:9000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding-bottom:160px;
  transition:opacity .4s ease;
}
.splash-logo{width:130px;height:130px;display:flex;align-items:center;justify-content:center}
.splash-logo img{width:100%;height:100%;object-fit:contain}
body.dark .splash-logo img{filter:invert(1)}
.splash-label{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;letter-spacing:3px;color:var(--t4);text-transform:uppercase}
.splash.hide{opacity:0;pointer-events:none}

/* ── HEADER — background set via JS inline style for instant dark/light switch ── */
.header{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:var(--hh);
  /* background set by JS */
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  display:none;align-items:center;justify-content:space-between;padding:0 16px;
  transition:background .25s,border-color .25s;
}
.header.show{display:flex}
.hlogo{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.hlogo img{width:30px;height:30px;object-fit:contain}
.hright{display:flex;align-items:center;gap:8px}
.month-pill{display:flex;align-items:center;gap:5px;background:var(--bl);border-radius:20px;padding:7px 14px;cursor:pointer;font-size:15px;font-weight:600;color:var(--blue);border:none;font-family:inherit}
.month-pill:active{opacity:.6}
.chevron{display:inline-block;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px}
.dark-btn{width:36px;height:36px;border-radius:50%;background:var(--s2);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s}

/* ── SCROLL ── */
.scroll{position:fixed;top:var(--hh);left:0;right:0;bottom:var(--bnh);overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--bg);display:none;transition:background .25s}
.scroll.show{display:block}
.scroll::-webkit-scrollbar{display:none}
.scroll.with-daybar{bottom:calc(var(--bnh) + var(--bbh))}
.panel{display:none;padding:16px 16px 28px;animation:fadeUp .22s ease}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:300;height:var(--bnh);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border);display:none;align-items:flex-start;padding-top:10px;padding-bottom:env(safe-area-inset-bottom,10px);transition:background .25s,border-color .25s}
.bnav.show{display:flex}
.bnav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--t4);font-size:10px;font-weight:600;border:none;background:none;font-family:inherit;padding:0;transition:color .18s}
.bnav-tab svg{width:26px;height:26px;transition:transform .18s}
.bnav-tab.active{color:var(--blue)}
.bnav-tab.active svg{transform:scale(1.1)}

/* ── DAY BAR ── */
.daybar{position:fixed;left:0;right:0;z-index:299;height:var(--bbh);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border);display:none;align-items:center;padding:0 16px;gap:10px;bottom:var(--bnh);transition:background .25s,border-color .25s}
.daybar.show{display:flex}
.nav-btn{width:40px;height:40px;border-radius:50%;background:var(--s2);border:none;color:var(--t2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
.nav-btn:active{opacity:.5}
.day-center{flex:1;text-align:center;cursor:pointer}
.day-main{font-size:16px;font-weight:700;color:var(--text)}
.day-sub{font-size:12px;color:var(--blue);margin-top:1px;font-weight:500}

/* ── CARDS ── */
.card{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.sec{font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:16px 4px 8px}
.sec:first-child{padding-top:4px}
.sg{display:grid;gap:10px;margin-bottom:12px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.stat{background:var(--surface);border-radius:14px;padding:14px 12px;box-shadow:var(--sh)}
.stat-l{font-size:10px;color:var(--t3);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1}
.stat-v.sm{font-size:16px}
.stat-s{font-size:11px;color:var(--t4);margin-top:4px}
.bl{color:var(--blue)}.gr{color:var(--green)}.rd{color:var(--red)}.or{color:var(--orange)}.pu{color:var(--purple)}

/* ── LIST ── */
.lrow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--b2)}
.lrow:last-child{border-bottom:none}
.lname{font-size:15px;color:var(--text);flex:1;padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lval{font-size:15px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}

/* ── TABLE ── */
.tbl-h{display:grid;padding:8px 14px;background:var(--s3);border-bottom:1px solid var(--b2);font-size:10px;color:var(--t4);font-weight:600;text-transform:uppercase;letter-spacing:.4px;gap:4px}
.tbl-r{display:grid;padding:11px 14px;border-bottom:1px solid var(--b2);font-size:13px;gap:4px;color:var(--text)}
.tbl-r:last-child{border-bottom:none}
.gc5{grid-template-columns:52px 1fr 1fr 1fr 1fr}
.gc4i{grid-template-columns:52px 1fr 1fr 1fr}

/* ── PROGRESS ── */
.prog-i{padding:10px 16px;border-bottom:1px solid var(--b2)}
.prog-i:last-child{border-bottom:none}
.prog-top{display:flex;justify-content:space-between;margin-bottom:6px}
.prog-n{font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%}
.prog-v{font-size:15px;font-weight:600;color:var(--t2)}
.prog-bg{height:4px;background:var(--s2);border-radius:2px;overflow:hidden}
.prog-f{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.16,1,.3,1)}

/* ── DONUT ── */
.donut-wrap{display:flex;align-items:center;gap:16px;padding:16px}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:7px}
.donut-item{display:flex;align-items:center;gap:8px}
.donut-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.donut-nm{font-size:12px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut-val{font-size:12px;font-weight:600;color:var(--text)}

/* ── SALARY ROW ── */
.sal-r{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--b2)}
.sal-r:last-child{border-bottom:none}
.sal-left{flex:1;min-width:0}
.sal-nm{font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sal-det{font-size:11px;color:var(--t3);margin-top:1px}
.sal-right{text-align:right;flex-shrink:0;padding-left:12px}
.sal-cash{font-size:17px;font-weight:700;color:var(--blue);letter-spacing:-.4px}
.sal-card{font-size:11px;color:var(--t4);margin-top:1px}
.sal-bar{margin-top:5px;height:3px;background:var(--s2);border-radius:2px;overflow:hidden}
.sal-bar-f{height:100%;border-radius:2px;background:var(--red);transition:width 1s cubic-bezier(.16,1,.3,1)}

/* ── CHART ── */
.ch-wrap{padding:12px 14px 14px}

/* ── LOADING ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:14px}
.spinner{width:28px;height:28px;border:2.5px solid var(--s2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-size:14px;color:var(--t4)}
.empty{padding:48px 20px;text-align:center;color:var(--t4);font-size:15px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:0 0 32px;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,0,.67,0);max-height:88vh;overflow-y:auto}
.overlay.open .sheet{transform:translateY(0);transition:transform .32s cubic-bezier(.16,1,.3,1)}
.handle{width:36px;height:4px;background:var(--s2);border-radius:2px;margin:12px auto 0}
.sh-title{font-size:17px;font-weight:700;text-align:center;padding:13px 20px 0;color:var(--text)}
.mi{padding:15px 20px;font-size:16px;cursor:pointer;border-bottom:1px solid var(--b2);display:flex;align-items:center;justify-content:space-between;color:var(--text)}
.mi:last-child{border-bottom:none}

@media(min-width:1024px){
  .panel{max-width:860px;margin:0 auto;padding:20px 28px 28px}
  .header{padding:0 28px}
  .bnav{display:none!important}
  .scroll{bottom:var(--bbh)}
  .daybar{bottom:0}
}
</style>
</head>

<script>
// ── LOGO ──
function applyLogos(){
  const dark=document.body.classList.contains('dark'),f=dark?'invert(1)':'none';
  ['splashLogo','hdrLogo'].forEach(id=>{const el=document.getElementById(id);if(el){el.src=LOGO_URI;el.style.filter=f;}});
}

// ── DARK MODE ──
// FIX: set background directly via JS inline style — bypasses backdrop-filter stacking context issue
function applyThemeStyles(){
  const dark=document.body.classList.contains('dark');
  const hbg=dark?'rgba(28,28,30,.96)':'rgba(242,242,247,.95)';
  const nbg=dark?'rgba(28,28,30,.97)':'rgba(248,248,252,.97)';
  const hdr=document.getElementById('hdr');
  const bnav=document.getElementById('bnav');
  const daybar=document.getElementById('daybar');
  if(hdr)hdr.style.background=hbg;
  if(bnav)bnav.style.background=nbg;
  if(daybar)daybar.style.background=nbg;
}

function toggleDark(){
  document.body.classList.toggle('dark');
  const isDark=document.body.classList.contains('dark');
  try{localStorage.setItem('so_ana_dark',isDark?'1':'0');}catch(e){}
  document.getElementById('darkBtn').textContent=isDark?'☀️':'🌙';
  applyLogos();
  applyThemeStyles(); // instant update
}

(function initTheme(){
  try{if(localStorage.getItem('so_ana_dark')==='1')document.body.classList.add('dark');}catch(e){}
  applyLogos();
  applyThemeStyles();
  document.getElementById('darkBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';
})();

// ── SPLASH ──
window.addEventListener('load',()=>{
  applyLogos();
  applyThemeStyles();
  setTimeout(()=>{
    const sp=document.getElementById('splash');
    sp.classList.add('hide');
    setTimeout(()=>{
      sp.style.display='none';
      document.getElementById('hdr').classList.add('show');
      document.getElementById('scrollArea').classList.add('show');
      document.getElementById('bnav').classList.add('show');
      applyThemeStyles();
      loadSheets();
    },400);
  },900);
});

// ── STATE ──
const BASE=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}`;
let months=[],curMonth='',curTab='day';
let curDay=new Date(),calView=new Date();
let sheetCache={},charts={};
let tabLoaded={day:false,month:false,kassa:false,inkass:false,salary:false};

async function getSheetData(name){
  if(sheetCache[name])return sheetCache[name];
  const r=encodeURIComponent(`'${name}'`);
  const res=await fetch(`${BASE}/values/${r}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`);
  const d=await res.json();
  return sheetCache[name]=d.values||[];
}

async function loadSheets(){
  try{
    const res=await fetch(`${BASE}?key=${API_KEY}&fields=sheets.properties.title`);
    const d=await res.json();
    if(d.error){showErr('day','API: '+d.error.message);return;}
    months=d.sheets.map(s=>s.properties.title).filter(n=>!SKIP.some(s=>n.toLowerCase()===s.toLowerCase()));
    if(!months.length){showErr('day','Нет листов');return;}
    const now=new Date(),cur=MRU[now.getMonth()]+' '+now.getFullYear();
    curMonth=months.includes(cur)?cur:months[months.length-1];
    buildMonthSel();curDay=new Date();updateDayBar();switchTab('day');
  }catch(e){showErr('day','Ошибка: '+e.message);}
}

function buildMonthSel(){
  document.getElementById('pillTxt').textContent=curMonth;
  document.getElementById('monthList').innerHTML=months.slice().reverse().map(m=>`
    <div class="mi" onclick="pickMonth('${esc(m)}')">
      <span style="color:${m===curMonth?'var(--blue)':'var(--text)'};font-weight:${m===curMonth?700:400}">${esc(m)}</span>
      ${m===curMonth?'<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="9" fill="var(--blue)"/><path d="m5 9 2.5 2.5L13 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>':''}
    </div>`).join('');
}
function pickMonth(m){
  curMonth=m;sheetCache={};tabLoaded={day:false,month:false,kassa:false,inkass:false,salary:false};
  buildMonthSel();document.getElementById('monthModal').classList.remove('open');switchTab(curTab,true);
}
function openMonthModal(){document.getElementById('monthModal').classList.add('open');}
function bgClose(e,id){if(e.target===document.getElementById(id))document.getElementById(id).classList.remove('open');}

function switchTab(tab,force=false){
  curTab=tab;
  document.querySelectorAll('.bnav-tab').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('btab-'+tab);if(btn)btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  const db=document.getElementById('daybar'),sc=document.getElementById('scrollArea');
  if(tab==='day'){db.classList.add('show');sc.classList.add('with-daybar');}
  else{db.classList.remove('show');sc.classList.remove('with-daybar');}
  if(!tabLoaded[tab]||force){tabLoaded[tab]=true;loadTab(tab);}
}
function loadTab(t){
  if(t==='day')loadDay();else if(t==='month')loadMonth();
  else if(t==='kassa')loadKassa();else if(t==='inkass')loadInkass();else if(t==='salary')loadSalary();
}

function updateDayBar(){
  const d=curDay,dIM=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  document.getElementById('dayMain').textContent=fmt(d);
  document.getElementById('daySub').textContent=`День ${d.getDate()} из ${dIM} · выбрать ↑`;
}
function changeDay(dir){const d=new Date(curDay);d.setDate(d.getDate()+dir);curDay=d;updateDayBar();if(curTab==='day')loadDay();}
function fmt(d){return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}

function findDayBlock(rows,dateStr){
  for(let r=0;r<Math.min(200,rows.length);r++){
    const row=rows[r]||[];
    for(let c=0;c<row.length;c++){if(String(row[c]||'').includes(dateStr))return{blockRow:r,blockCol:c};}
  }
  return null;
}

async function loadDay(){
  spin('day');
  try{
    const rows=await getSheetData(curMonth);
    const block=findDayBlock(rows,fmt(curDay));
    if(!block){document.getElementById('panel-day').innerHTML=`<div class="empty">Нет данных за ${fmt(curDay)}</div>`;return;}
    const{blockRow:br,blockCol:bc}=block;

    // Employees — scan rows until "итого" or empty name
    const emps=[];
    for(let dr=br+CFG.EMP_ROW_START;dr<br+CFG.EMP_ROW_START+CFG.EMP_COUNT+5&&dr<rows.length;dr++){
      const name=String((rows[dr]||[])[bc]||'').trim();
      if(!name||name.toLowerCase().includes('итого'))break;
      const chk=(rows[dr]||[])[bc+2];
      const absent=chk===true||chk===1||String(chk).toLowerCase()==='true';
      emps.push({name,absent});
    }

    // All expense rows in day block (includes employees with sums AND other expenses)
    // We scan from row after header (+1) through TOTAL_ROW_OFFSET
    const others=[];
    for(let dr=br+1;dr<br+CFG.TOTAL_ROW_OFFSET&&dr<rows.length;dr++){
      const name=String((rows[dr]||[])[bc]||'').trim();
      if(!name||name.toLowerCase().includes('итого')||name.toLowerCase().includes('наименование'))continue;
      const sum=pf((rows[dr]||[])[bc+1]);
      if(sum>0)others.push({name,sum});
    }

    // Kassa for this day
    let kassaOpen=0,kassaIncome=0,kassaExpense=0,kassaBalance=0;
    const{rStart:ks,rEnd:ke,cDate:kd,cOpen:ko,cIncome:ki,cExpense:kx,cBalance:kb}=CFG.KASSA;
    for(let r=ks;r<=Math.min(ke,rows.length-1);r++){
      const date=(rows[r]||[])[kd];if(!date&&date!==0)continue;
      if(normDate(date)===fmt(curDay)){kassaOpen=pf((rows[r]||[])[ko]);kassaIncome=pf((rows[r]||[])[ki]);kassaExpense=pf((rows[r]||[])[kx]);kassaBalance=pf((rows[r]||[])[kb]);break;}
    }

    // Инкассация for this day — cols: date, sum, expense, reason, total
    let inkSum=0,inkExpense=0,inkReason='',inkTotal=0;
    const{rStart:is2,rEnd:ie2,cDate:id2,cSum:isum,cExpense:iexp,cReason:irs,cTotal:itot}=CFG.INKASS;
    for(let r=is2;r<=Math.min(ie2,rows.length-1);r++){
      const date=(rows[r]||[])[id2];if(!date&&date!==0)continue;
      if(normDate(date)===fmt(curDay)){
        inkSum=pf((rows[r]||[])[isum]);
        inkExpense=pf((rows[r]||[])[iexp]);
        inkReason=String((rows[r]||[])[irs]||'').trim();
        inkTotal=pf((rows[r]||[])[itot]);
        break;
      }
    }

    const present=emps.filter(e=>!e.absent);
    const absent=emps.filter(e=>e.absent);
    const dayTotal=others.reduce((s,o)=>s+o.sum,0);

    let html=`
    <div class="sg c2">
      <div class="stat"><div class="stat-l">Расход дня</div><div class="stat-v rd">${fv(dayTotal)}</div></div>
      <div class="stat"><div class="stat-l">Отсутствуют</div><div class="stat-v rd">${absent.length}</div></div>
    </div>
    <div class="sg c4">
      <div class="stat"><div class="stat-l">Вход</div><div class="stat-v sm bl">${fv(kassaOpen)}</div></div>
      <div class="stat"><div class="stat-l">Доход</div><div class="stat-v sm gr">${fv(kassaIncome)}</div></div>
      <div class="stat"><div class="stat-l">Расход</div><div class="stat-v sm rd">${fv(kassaExpense)}</div></div>
      <div class="stat"><div class="stat-l">Касса</div><div class="stat-v sm bl">${fv(kassaBalance)}</div></div>
    </div>`;

    html+=`<div class="sec">Расходы</div><div class="card">`;
    if(others.length){others.forEach(o=>{html+=`<div class="lrow"><div class="lname">${esc(o.name)}</div><div class="lval rd">−${fv(o.sum)}</div></div>`;});}
    else{html+=`<div class="empty" style="padding:24px">Нет расходов</div>`;}
    html+=`</div>`;

    // Инкассация — 4 sections from inkass block columns
    html+=`<div class="sec">Инкассация</div><div class="card" style="padding:14px 16px">`;
    html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><div style="font-size:18px">💰</div><div style="font-size:15px;font-weight:600;color:var(--text)">${fmt(curDay)}</div></div>`;
    html+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1px;background:var(--b2);border-radius:10px;overflow:hidden">`;
    html+=`<div style="background:var(--surface);padding:10px 8px"><div style="font-size:9px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px">Приход</div><div style="font-size:15px;font-weight:700;color:var(--green)">${inkSum>0?fv(inkSum):'—'}</div></div>`;
    html+=`<div style="background:var(--surface);padding:10px 8px"><div style="font-size:9px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px">Расход</div><div style="font-size:15px;font-weight:700;color:var(--red)">${inkExpense>0?fv(inkExpense):'—'}</div></div>`;
    html+=`<div style="background:var(--surface);padding:10px 8px"><div style="font-size:9px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px">Причина</div><div style="font-size:12px;color:var(--t2);line-height:1.3">${inkReason||'—'}</div></div>`;
    html+=`<div style="background:var(--surface);padding:10px 8px"><div style="font-size:9px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px">Итог</div><div style="font-size:15px;font-weight:700;color:var(--orange)">${fv(inkTotal)}</div></div>`;
    html+=`</div></div>`;

    if(absent.length){
      html+=`<div class="sec">Отсутствуют (${absent.length})</div><div class="card">`;
      absent.forEach(e=>{html+=`<div class="lrow"><div class="lname" style="color:var(--t3)">${esc(e.name)}</div><div style="font-size:13px;color:var(--red)">✗</div></div>`;});
      html+=`</div>`;
    }
    document.getElementById('panel-day').innerHTML=html;
  }catch(e){showErr('day','Ошибка: '+e.message);}
}

async function loadMonth(){
  spin('month');
  try{
    const rows=await getSheetData(curMonth);
    const{rStart,rEnd,cName,cSum}=CFG.EXPENSES;
    const items=[];let total=0;
    for(let r=rStart;r<=Math.min(rEnd,rows.length-1);r++){
      const name=String((rows[r]||[])[cName]||'').trim();
      if(!name||name.toLowerCase().includes('итого')||name.toLowerCase().includes('наименование'))continue;
      const sum=pf((rows[r]||[])[cSum]);
      if(sum>0){items.push({name,sum});total+=sum;}
    }
    const{rStart:ks,rEnd:ke,cDate:kd,cIncome:ki}=CFG.KASSA;
    let totalIncome=0;
    for(let r=ks;r<=Math.min(ke,rows.length-1);r++){
      const date=(rows[r]||[])[kd];if(!date&&date!==0)continue;
      const ds=normDate(date);if(!ds||ds.length<8)continue;
      totalIncome+=pf((rows[r]||[])[ki]);
    }
    if(!items.length){document.getElementById('panel-month').innerHTML=`<div class="empty">Нет данных за ${curMonth}</div>`;return;}
    items.sort((a,b)=>b.sum-a.sum);
    const top5=items.slice(0,5),maxSum=items[0].sum;
    const donutColors=COLORS.slice(0,top5.length);
    let legend=top5.map((it,i)=>`
      <div class="donut-item"><div class="donut-dot" style="background:${donutColors[i]}"></div><div class="donut-nm">${esc(it.name)}</div><div class="donut-val">${fv(it.sum)}</div></div>`).join('');
    let topRows=top5.map((it,i)=>{
      const pct=Math.min(it.sum/maxSum*100,100);
      return `<div class="prog-i"><div class="prog-top"><div class="prog-n">${esc(it.name)}</div><div class="prog-v">${fv(it.sum)}</div></div><div class="prog-bg"><div class="prog-f" style="width:${pct.toFixed(1)}%;background:${donutColors[i]}"></div></div></div>`;
    }).join('');
    let allRows=items.map(it=>`<div class="lrow"><div class="lname">${esc(it.name)}</div><div class="lval rd">${fv(it.sum)}</div></div>`).join('');

    document.getElementById('panel-month').innerHTML=`
      <div class="sg c2">
        <div class="stat"><div class="stat-l">Итого за месяц</div><div class="stat-v rd">${fv(total)}</div></div>
        <div class="stat"><div class="stat-l">Доход</div><div class="stat-v gr">${fv(totalIncome)}</div></div>
      </div>
      <div class="sec">Структура</div>
      <div class="card"><div class="donut-wrap"><canvas id="donutC" width="120" height="120"></canvas><div class="donut-legend">${legend}</div></div></div>
      <div class="sec">Топ расходов</div>
      <div class="card">${topRows}</div>
      <div class="sec">Все категории</div>
      <div class="card">${allRows}</div>`;
    setTimeout(()=>{
      const ctx=document.getElementById('donutC');
      if(ctx){if(charts.donut)charts.donut.destroy();charts.donut=new Chart(ctx,{type:'doughnut',data:{labels:top5.map(i=>i.name),datasets:[{data:top5.map(i=>i.sum),backgroundColor:donutColors,borderWidth:0,hoverOffset:4}]},options:{responsive:false,cutout:'68%',plugins:{legend:{display:false}}}});}
    },80);
  }catch(e){showErr('month','Ошибка: '+e.message);}
}

async function loadKassa(){
  spin('kassa');
  try{
    const rows=await getSheetData(curMonth);
    const{rStart,rEnd,cDate,cOpen,cIncome,cExpense,cBalance}=CFG.KASSA;
    const data=[];
    for(let r=rStart;r<=Math.min(rEnd,rows.length-1);r++){
      const date=(rows[r]||[])[cDate];if(!date&&date!==0)continue;
      const ds=normDate(date);if(!ds||ds.length<8)continue;
      data.push({date:ds,open:pf((rows[r]||[])[cOpen]),income:pf((rows[r]||[])[cIncome]),expense:pf((rows[r]||[])[cExpense]),balance:pf((rows[r]||[])[cBalance])});
    }
    if(!data.length){document.getElementById('panel-kassa').innerHTML='<div class="empty">Нет данных кассы</div>';return;}

    // Last with income > 0
    const lastInc=[...data].reverse().find(d=>d.income>0)||{income:0,date:''};
    // Last with balance > 0
    const lastBal=[...data].reverse().find(d=>d.balance>0)||data[data.length-1];
    // Only show filled rows
    const filled=data.filter(d=>d.income>0||d.expense>0||d.open>0||d.balance>0);
    const labels=filled.map(r=>r.date.slice(0,5));
    const balArr=filled.map(r=>r.balance);
    const incArr=filled.map(r=>r.income);
    const expArr=filled.map(r=>r.expense);

    let rhtml=filled.map(r=>`
      <div class="tbl-r gc5">
        <span style="color:var(--t3);font-size:12px">${r.date.slice(0,5)}</span>
        <span style="color:var(--blue)">${r.open>0?fv(r.open):'—'}</span>
        <span style="color:var(--green);font-weight:600">${r.income>0?fv(r.income):'—'}</span>
        <span style="color:var(--red)">${r.expense>0?fv(r.expense):'—'}</span>
        <span style="color:var(--blue);font-weight:700">${fv(r.balance)}</span>
      </div>`).join('');

    document.getElementById('panel-kassa').innerHTML=`
      <div class="sg c2">
        <div class="stat"><div class="stat-l">Остаток</div><div class="stat-v bl">${fv(lastBal.balance)}</div></div>
        <div class="stat"><div class="stat-l">Доход посл.</div><div class="stat-v gr">${fv(lastInc.income)}</div><div class="stat-s">${lastInc.date?lastInc.date.slice(0,5):'—'}</div></div>
      </div>
      <div class="sec">Баланс кассы</div>
      <div class="card"><div class="ch-wrap"><canvas id="kBal" style="max-height:140px"></canvas></div></div>
      <div class="sec">Доходы и расходы</div>
      <div class="card"><div class="ch-wrap"><canvas id="kBar" style="max-height:130px"></canvas></div></div>
      <div class="sec">По дням</div>
      <div class="card">
        <div class="tbl-h gc5"><span>Дата</span><span>Вход</span><span>Доход</span><span>Расход</span><span>Касса</span></div>${rhtml}
      </div>`;
    setTimeout(()=>{
      const c1=document.getElementById('kBal');
      if(c1){if(charts.kBal)charts.kBal.destroy();charts.kBal=new Chart(c1,{type:'line',data:{labels,datasets:[{data:balArr,borderColor:'#007aff',backgroundColor:'rgba(0,122,255,.07)',borderWidth:2,pointRadius:2,fill:true,tension:.4}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aeaeb2',font:{size:9},maxTicksLimit:8},grid:{color:'rgba(60,60,67,.05)'}},y:{ticks:{color:'#aeaeb2',font:{size:9},callback:v=>'€'+Math.round(v)},grid:{color:'rgba(60,60,67,.05)'}}}}});}
      const c2=document.getElementById('kBar');
      if(c2){if(charts.kBar)charts.kBar.destroy();charts.kBar=new Chart(c2,{type:'bar',data:{labels,datasets:[{label:'Доход',data:incArr,backgroundColor:'rgba(52,199,89,.7)',borderRadius:4},{label:'Расход',data:expArr,backgroundColor:'rgba(255,59,48,.65)',borderRadius:4}]},options:{responsive:true,plugins:{legend:{labels:{color:'#6d6d72',font:{size:11},boxWidth:10}}},scales:{x:{ticks:{color:'#aeaeb2',font:{size:9},maxTicksLimit:8},grid:{display:false}},y:{ticks:{color:'#aeaeb2',font:{size:9},callback:v=>'€'+Math.round(v)},grid:{color:'rgba(60,60,67,.05)'}}}}});}
    },80);
  }catch(e){showErr('kassa','Ошибка: '+e.message);}
}

async function loadInkass(){
  spin('inkass');
  try{
    const rows=await getSheetData(curMonth);
    const{rStart,rEnd,cDate,cSum,cExpense:iExp,cReason,cTotal}=CFG.INKASS;
    const data=[];
    for(let r=rStart;r<=Math.min(rEnd,rows.length-1);r++){
      const date=(rows[r]||[])[cDate];if(!date&&date!==0)continue;
      const ds=normDate(date);if(!ds||ds.length<8)continue;
      data.push({date:ds,sum:pf((rows[r]||[])[cSum]),expense:pf((rows[r]||[])[iExp]),reason:String((rows[r]||[])[cReason]||'').trim(),total:pf((rows[r]||[])[cTotal])});
    }

    // "Баланс" = last non-zero total from inkass block
    const lastWithTotal=[...data].reverse().find(d=>d.total>0);
    const lastTotal=lastWithTotal?lastWithTotal.total:0;

    // ЗП на сегодня = sum of cCash / days * today (rounded, no kopecks)
    const{rStart:sr,rEnd:se,cName:sn,cCash}=CFG.SALARY;
    let totalCashSalary=0;
    for(let r=sr;r<=Math.min(se,rows.length-1);r++){
      const name=String((rows[r]||[])[sn]||'').trim();
      if(!name||name.toLowerCase().includes('итого')||name.toLowerCase().includes('сотрудник'))continue;
      totalCashSalary+=pf((rows[r]||[])[cCash]);
    }
    const now=new Date(),dIM=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),dom=now.getDate();
    const salToday=Math.round(totalCashSalary>0?(totalCashSalary/dIM*dom):0);
    const salBalance=lastTotal-salToday;
    const salStatusColor=salBalance>=0?'var(--green)':'var(--red)';
    const salStatusText=salBalance>=0?'Опережаем':'Отстаём';

    // Chart: only rows up to last filled
    const chartData=data.filter(d=>d.sum>0||d.total>0);
    const labels=chartData.map(d=>d.date.slice(0,5));
    const totals=chartData.map(d=>d.total);
    const maxT=Math.max(...totals.filter(v=>v>0),1);

    // Table: only rows with sum > 0
    const inkEntries=data.filter(d=>d.sum>0);
    let rhtml=inkEntries.map(d=>`
      <div class="tbl-r gc4i">
        <span style="color:var(--t3);font-size:12px">${d.date.slice(0,5)}</span>
        <span style="color:var(--orange);font-weight:600">${fv(d.sum)}</span>
        <span style="color:var(--t4);font-size:12px">${d.reason||'—'}</span>
        <span style="color:var(--blue);font-weight:600">${fv(d.total)}</span>
      </div>`).join('');

    document.getElementById('panel-inkass').innerHTML=`
      <div class="sg c2">
        <div class="stat"><div class="stat-l">Баланс</div><div class="stat-v or">${fv(lastTotal)}</div></div>
        <div class="stat"><div class="stat-l">ЗП на сегодня</div><div class="stat-v" style="color:${salStatusColor}">€${salToday.toLocaleString('de-DE')}</div><div class="stat-s" style="color:${salStatusColor}">${salStatusText} €${Math.abs(salBalance).toLocaleString('de-DE')}</div></div>
      </div>
      <div class="sec">Динамика</div>
      <div class="card"><div class="ch-wrap"><canvas id="iC" style="max-height:140px"></canvas></div></div>
      <div class="sec">История</div>
      <div class="card">
        ${inkEntries.length
          ?`<div class="tbl-h gc4i"><span>Дата</span><span>Сумма</span><span>Причина</span><span>Итог</span></div>${rhtml}`
          :`<div class="empty" style="padding:24px">Нет инкассаций</div>`}
      </div>`;
    setTimeout(()=>{
      const ctx=document.getElementById('iC');
      if(ctx){
        if(charts.ink)charts.ink.destroy();
        charts.ink=new Chart(ctx,{type:'line',data:{labels,datasets:[{data:totals,borderColor:'#ff9500',backgroundColor:'rgba(255,149,0,.08)',borderWidth:2,pointRadius:3,fill:true,tension:.4}]},
          options:{responsive:true,plugins:{legend:{display:false}},
            scales:{
              x:{ticks:{color:'#aeaeb2',font:{size:9},maxTicksLimit:8},grid:{color:'rgba(60,60,67,.05)'}},
              y:{min:0,suggestedMax:maxT*1.15,
                ticks:{color:'#aeaeb2',font:{size:9},callback:v=>'€'+Math.round(v)},
                grid:{color:'rgba(60,60,67,.05)'}
              }
            }
          }
        });
      }
    },80);
  }catch(e){showErr('inkass','Ошибка: '+e.message);}
}

// СМЕНЫ
// ═══════════════════════════════════
async function loadSalary(){
  spin('salary');
  try{
    const rows=await getSheetData(curMonth);
    const{rStart,rEnd,cName,cSalary,cDeduct,cAbsent,cTotalDeduct,cCard,cCash}=CFG.SALARY;
    const data=[];
    for(let r=rStart;r<=Math.min(rEnd,rows.length-1);r++){
      const name=String((rows[r]||[])[cName]||'').trim();
      if(!name||name.toLowerCase().includes('итого')||name.toLowerCase().includes('сотрудник'))continue;
      data.push({
        name,
        salary:pf((rows[r]||[])[cSalary]),
        totalDeduct:pf((rows[r]||[])[cTotalDeduct]),
        absent:pf((rows[r]||[])[cAbsent]),
        card:pf((rows[r]||[])[cCard]),
        cash:pf((rows[r]||[])[cCash]),
      });
    }
    if(!data.length){document.getElementById('panel-salary').innerHTML='<div class="empty">Нет данных</div>';return;}

    // ФОТ with deductions (salary - totalDeduct)
    const totalFOT=data.reduce((s,r)=>s+(r.salary-r.totalDeduct),0);
    const totalCard=data.reduce((s,r)=>s+r.card,0);
    const totalCash=data.reduce((s,r)=>s+r.cash,0);
    const WORK_DAYS=22;

    let shtml=data.map(d=>{
      const pct=Math.min(d.absent/WORK_DAYS*100,100);
      const hasCash=d.cash>0,hasCard=d.card>0;
      const main=hasCash?d.cash:(hasCard?d.card:0);
      return `<div class="sal-r">
        <div class="sal-left">
          <div class="sal-nm">${esc(d.name)}</div>
          <div class="sal-det">ЗП: ${fv(d.salary)}${d.totalDeduct>0?` · −${fv(d.totalDeduct)}`:''}${d.absent>0?` · Пропусков: ${d.absent}`:''}</div>
          ${d.absent>0?`<div class="sal-bar"><div class="sal-bar-f" style="width:${pct.toFixed(1)}%"></div></div>`:''}
        </div>
        <div class="sal-right">
          <div class="sal-cash">${fv(main)}</div>
          ${hasCard?`<div class="sal-card">на карту: ${fv(d.card)}</div>`:''}
        </div>
      </div>`;
    }).join('');

    // 3 stat cards in a row
    document.getElementById('panel-salary').innerHTML=`
      <div class="sg c3">
        <div class="stat"><div class="stat-l">ФОТ</div><div class="stat-v sm bl">${fv(totalFOT)}</div></div>
        <div class="stat"><div class="stat-l">Нал</div><div class="stat-v sm or">${fv(totalCash)}</div></div>
        <div class="stat"><div class="stat-l">Карта</div><div class="stat-v sm pu">${fv(totalCard)}</div></div>
      </div>
      <div class="sec">Сотрудники</div>
      <div class="card">${shtml}</div>`;
  }catch(e){showErr('salary','Ошибка: '+e.message);}
}

// ── CALENDAR ──
const MRU_CAL=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DOW_CAL=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function openDayPicker(){calView=new Date(curDay.getFullYear(),curDay.getMonth(),1);renderCal();document.getElementById('dayModal').classList.add('open');}
function calGo(d){calView.setMonth(calView.getMonth()+d);renderCal();}
function renderCal(){
  const yr=calView.getFullYear(),mo=calView.getMonth();
  document.getElementById('calLbl').textContent=MRU_CAL[mo]+' '+yr;
  const todayStr=fmt(new Date()),selStr=fmt(curDay);
  let h=DOW_CAL.map(d=>`<div style="text-align:center;font-size:10px;font-weight:600;color:var(--t4);padding:3px 0 6px">${d}</div>`).join('');
  let first=new Date(yr,mo,1).getDay();if(first===0)first=7;
  for(let i=1;i<first;i++)h+=`<div></div>`;
  const dim=new Date(yr,mo+1,0).getDate();
  for(let d=1;d<=dim;d++){
    const dd=String(d).padStart(2,'0'),mm=String(mo+1).padStart(2,'0'),ds=`${dd}.${mm}.${yr}`;
    const isSel=ds===selStr,isToday=ds===todayStr;
    h+=`<div style="display:flex;justify-content:center"><button onclick="pickDay('${ds}')" style="aspect-ratio:1;width:100%;max-width:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px;border:none;background:${isSel?'var(--blue)':'none'};color:${isSel?'#fff':isToday?'var(--blue)':'var(--text)'};font-weight:${isSel||isToday?700:400};cursor:pointer;font-family:inherit">${d}</button></div>`;
  }
  document.getElementById('calGrid').innerHTML=h;
}
function pickDay(ds){
  const p=ds.split('.');curDay=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
  updateDayBar();document.getElementById('dayModal').classList.remove('open');loadDay();
}

// ── UTILS ──
function spin(t){document.getElementById('panel-'+t).innerHTML='<div class="loading"><div class="spinner"></div><div class="ltxt">Загрузка...</div></div>';}
function showErr(t,m){const el=document.getElementById('panel-'+t);if(el)el.innerHTML=`<div class="empty">${esc(m)}</div>`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fv(v){const n=pf(v);return isNaN(n)?'€0,00':'€'+n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pf(v){const n=parseFloat(String(v||0).replace(',','.'));return isNaN(n)?0:n;}
function normDate(d){
  if(!d)return'';
  d=String(d).split(' - ')[0].split(' – ')[0].trim();
  if(/^\d{5}$/.test(d)||typeof d==='number'){const s=parseInt(d);const dt=new Date((s-25569)*86400*1000);return String(dt.getUTCDate()).padStart(2,'0')+'.'+String(dt.getUTCMonth()+1).padStart(2,'0')+'.'+dt.getUTCFullYear();}
  if(/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(d)){const p=d.split('.');return p[0].padStart(2,'0')+'.'+p[1].padStart(2,'0')+'.'+p[2];}
  const dt=new Date(d);if(!isNaN(dt.getTime()))return String(dt.getDate()).padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0')+'.'+dt.getFullYear();
  return d;
}
</script>
