<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SO Analytics">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="https://i.postimg.cc/Dy1qT843/Bezymannyj-1-(1).jpg">
<title>SO Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html{font-size:16px;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',sans-serif;
  overflow:hidden;
  background:#e8eef5;
}
/* Живой фон — градиент как в iOS 26 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 15% 10%, rgba(120,180,255,0.55) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 5%,  rgba(180,140,255,0.45) 0%, transparent 55%),
    radial-gradient(ellipse 70% 60% at 50% 95%, rgba(100,210,200,0.35) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 80%, rgba(255,160,100,0.25) 0%, transparent 50%),
    linear-gradient(160deg, #c8dff5 0%, #d5e8f0 30%, #e0eee8 60%, #dde8f5 100%);
  animation: bgshift 18s ease-in-out infinite alternate;
}
@keyframes bgshift{
  0%  {filter:hue-rotate(0deg) brightness(1)}
  50% {filter:hue-rotate(12deg) brightness(1.04)}
  100%{filter:hue-rotate(-8deg) brightness(.97)}
}

:root{
  --bg:transparent;
  --surface:rgba(255,255,255,0.55);
  --surface2:rgba(255,255,255,0.35);
  --s2:rgba(118,118,128,.10);--s3:rgba(118,118,128,.06);
  --border:rgba(255,255,255,0.6);--b2:rgba(60,60,67,.08);
  --glass-border:rgba(255,255,255,0.7);
  --text:#1c1c1e;--t2:#3a3a3c;--t3:#6d6d72;--t4:#aeaeb2;
  --blue:#007aff;--bl:rgba(0,122,255,.12);
  --green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;
  --sh:0 2px 8px rgba(0,0,0,.07), 0 8px 32px rgba(0,0,0,.06);
  --sh-glass:0 4px 24px rgba(0,0,0,.10), 0 1px 0 rgba(255,255,255,.8) inset;
  --hh:56px;--th:50px;--bnh:82px;--bbh:64px;
  --blur:saturate(200%) blur(28px);
}

/* ── HEADER ── */
.header{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:var(--hh);
  background:rgba(235,242,252,0.72);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 2px 12px rgba(0,0,0,.06);
}
.logo{font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.logo img{height:32px;width:32px;object-fit:contain;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.month-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,122,255,0.14);
  border:1px solid rgba(0,122,255,0.25);
  border-radius:20px;padding:7px 14px;cursor:pointer;
  font-size:15px;font-weight:600;color:var(--blue);
  font-family:inherit;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:all .15s;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
}
.month-pill:active{opacity:.6;transform:scale(.96)}
.chevron{display:inline-block;width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px}

/* ── TOP TABS desktop ── */
.top-tabs{display:none}

/* ── SCROLL ── */
.scroll{
  position:fixed;top:var(--hh);left:0;right:0;
  bottom:calc(var(--bnh) + var(--bbh));
  overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  z-index:1;
}
.scroll::-webkit-scrollbar{display:none}
.scroll.no-daybar{bottom:var(--bnh)}
.panel{display:none;padding:16px 16px 8px;animation:up .28s cubic-bezier(.16,1,.3,1)}
.panel.active{display:block}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── BOTTOM NAV — Liquid Glass ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  height:var(--bnh);
  background:rgba(230,240,252,0.70);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--glass-border);
  display:flex;align-items:flex-start;
  padding-top:10px;
  padding-bottom:env(safe-area-inset-bottom,10px);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 -2px 16px rgba(0,0,0,.05);
}
.bnav-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;color:var(--t4);
  font-size:10.5px;font-weight:600;letter-spacing:.2px;
  border:none;background:none;font-family:inherit;padding:0;
  transition:all .2s cubic-bezier(.16,1,.3,1);
  position:relative;
}
.bnav-tab svg{width:26px;height:26px;transition:all .2s cubic-bezier(.16,1,.3,1)}
.bnav-tab.active{color:var(--blue)}
.bnav-tab.active svg{transform:scale(1.12)}
/* Liquid glass pill on active tab */
.bnav-tab.active::before{
  content:'';
  position:absolute;top:-6px;
  width:52px;height:38px;
  background:rgba(0,122,255,0.13);
  border-radius:14px;
  border:1px solid rgba(0,122,255,0.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
  z-index:-1;
  animation:pillpop .25s cubic-bezier(.16,1,.3,1);
}
@keyframes pillpop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

/* ── DAY BAR ── */
.day-bar{
  position:fixed;left:0;right:0;z-index:299;
  height:var(--bbh);
  background:rgba(240,246,255,0.72);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--glass-border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  bottom:var(--bnh);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
}
.nav-btn{
  width:44px;height:44px;border-radius:50%;
  background:var(--s2);border:none;
  color:var(--t2);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .12s;font-family:inherit;flex-shrink:0;
}
.nav-btn:active{opacity:.5;transform:scale(.93)}
.day-center{flex:1;text-align:center;cursor:pointer;padding:4px 0}
.day-main{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.day-sub{font-size:12px;color:var(--blue);margin-top:2px;font-weight:500}

/* ── CARDS — Liquid Glass ── */
.card{
  background:var(--surface);
  border-radius:20px;overflow:hidden;margin-bottom:12px;
  box-shadow:var(--sh-glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.sec{font-size:13px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:18px 4px 8px}
.sec:first-child{padding-top:2px}

/* ── STATS ── */
.sg{display:grid;gap:10px;margin-bottom:12px}
.c2{grid-template-columns:1fr 1fr}
.c4{grid-template-columns:repeat(4,1fr)}
.stat{
  background:var(--surface);
  border-radius:18px;padding:16px 14px;
  box-shadow:var(--sh-glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.stat-l{font-size:11px;color:var(--t3);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1}
.c4 .stat{padding:14px 10px}
.c4 .stat-v{font-size:17px;letter-spacing:-.4px}
.c4 .stat-l{font-size:10px;letter-spacing:.3px}
.stat-s{font-size:11px;color:var(--t4);margin-top:5px}
.bl{color:var(--blue)}.gr{color:var(--green)}.rd{color:var(--red)}.or{color:var(--orange)}

/* ── LIST ── */
.lrow{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b2);transition:background .1s}
.lrow:last-child{border-bottom:none}
.lrow:active{background:rgba(0,0,0,.03)}
.lname{font-size:17px;color:var(--text);flex:1;padding-right:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lval{font-size:17px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
.lval.rd{color:var(--red)}.lval.gr{color:var(--green)}.lval.bl{color:var(--blue)}.lval.or{color:var(--orange)}

/* ── TABLE ── */
.tbl-h{display:grid;padding:9px 16px;background:rgba(118,118,128,.06);border-bottom:1px solid var(--b2);font-size:11px;color:var(--t4);font-weight:600;text-transform:uppercase;letter-spacing:.4px;gap:4px}
.tbl-r{display:grid;padding:13px 16px;border-bottom:1px solid var(--b2);font-size:14px;gap:4px;transition:background .1s}
.tbl-r:last-child{border-bottom:none}
.kc{grid-template-columns:70px 1fr 1fr 1fr 1fr}
.ec{grid-template-columns:60px 1fr 1fr 1fr 1fr}

/* ── TOTAL ── */
.tot-row{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:rgba(118,118,128,.05);border-top:1px solid var(--b2)}
.tot-l{font-size:13px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.tot-v{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--text)}

/* ── MINI BLOCK ── */
.mini{
  background:var(--surface);border-radius:20px;overflow:hidden;margin-bottom:12px;
  box-shadow:var(--sh-glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.mini-h{padding:12px 16px;border-bottom:1px solid var(--b2);display:flex;align-items:center;gap:8px}
.mini-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.mini-t{font-size:15px;font-weight:600;color:var(--text)}
.mini-g{display:grid;gap:1px;background:var(--b2)}
.mini-g2{grid-template-columns:1fr 1fr}
.mini-g3{grid-template-columns:1fr 1fr 1fr}
.mini-c{background:rgba(255,255,255,.6);padding:13px 16px;display:flex;flex-direction:column;gap:4px}
.mini-l{font-size:12px;color:var(--t3)}
.mini-v{font-size:18px;font-weight:700;letter-spacing:-.3px}

/* ── CHART ── */
.ch-wrap{padding:12px 16px 16px}

/* ── PROGRESS ── */
.prog-i{padding:11px 18px;border-bottom:1px solid var(--b2)}
.prog-i:last-child{border-bottom:none}
.prog-top{display:flex;justify-content:space-between;margin-bottom:7px}
.prog-n{font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%}
.prog-v{font-size:15px;font-weight:600;color:var(--t2)}
.prog-bg{height:5px;background:var(--s2);border-radius:3px;overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .9s cubic-bezier(.16,1,.3,1)}

/* ── SALARY ── */
.sal-r{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b2)}
.sal-r:last-child{border-bottom:none}
.sal-av{width:40px;height:40px;border-radius:50%;background:rgba(0,122,255,.12);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--blue);margin-right:14px;flex-shrink:0;border:1px solid rgba(0,122,255,.2)}
.sal-nm{font-size:17px;color:var(--text)}
.sal-v{font-size:28px;font-weight:700;color:var(--blue);letter-spacing:-.5px}
.sal-lb{font-size:11px;color:var(--t4);text-align:right}

/* ── DEBT ── */
.debt-w{text-align:center;padding:70px 28px}
.debt-ic{width:72px;height:72px;background:rgba(255,149,0,.12);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px;border:1px solid rgba(255,149,0,.2);box-shadow:0 4px 16px rgba(255,149,0,.1)}
.debt-t{font-size:22px;font-weight:700;color:var(--text);margin-bottom:8px}
.debt-tx{font-size:16px;color:var(--t3);line-height:1.6}
.badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,149,0,.1);color:var(--orange);font-size:13px;font-weight:700;border-radius:20px;padding:6px 14px;margin-top:14px;border:1px solid rgba(255,149,0,.2)}

/* ── LOADING ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px}
.spinner{width:32px;height:32px;border:2.5px solid rgba(0,122,255,.15);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-size:15px;color:var(--t4)}
.empty{padding:48px 20px;text-align:center;color:var(--t4);font-size:16px}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.open{opacity:1;pointer-events:all}
.sheet{
  background:rgba(240,246,255,0.82);
  backdrop-filter:saturate(200%) blur(40px);-webkit-backdrop-filter:saturate(200%) blur(40px);
  border-radius:26px 26px 0 0;
  border:1px solid rgba(255,255,255,.75);
  border-bottom:none;
  width:100%;max-width:480px;padding:0 0 32px;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.32,0,.67,0);
  max-height:88vh;overflow-y:auto;
  box-shadow:0 -4px 40px rgba(0,0,0,.12), 0 1px 0 rgba(255,255,255,.8) inset;
}
.overlay.open .sheet{transform:translateY(0);transition:transform .35s cubic-bezier(.16,1,.3,1)}
.handle{width:36px;height:4px;background:rgba(60,60,67,.2);border-radius:2px;margin:12px auto 0}
.sh-title{font-size:18px;font-weight:700;text-align:center;padding:14px 20px 0;color:var(--text)}

/* ── CALENDAR ── */
.cal-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.cal-ml{font-size:17px;font-weight:700;color:var(--text)}
.cal-nav{display:flex;gap:8px}
.cal-nb{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.7);
  font-size:17px;color:var(--t2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 10px 10px}
.cdl{text-align:center;font-size:11px;font-weight:600;color:var(--t4);padding:3px 0 8px;text-transform:uppercase}
.cdw{display:flex;flex-direction:column;align-items:center}
.cd{aspect-ratio:1;width:100%;max-width:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px;color:var(--text);cursor:pointer;border:none;background:none;font-family:inherit;transition:all .12s}
.cd.has{font-weight:600}
.cd.sel{
  background:var(--blue)!important;color:#fff!important;font-weight:700;
  box-shadow:0 2px 12px rgba(0,122,255,.4);
}
.cd.emp{visibility:hidden;pointer-events:none}
.cd.nodata{color:var(--t4)}
.dot{width:4px;height:4px;border-radius:50%;background:var(--blue);margin:2px auto 0}

/* ── MONTH LIST ── */
.mi{padding:16px 20px;font-size:17px;cursor:pointer;border-bottom:1px solid var(--b2);display:flex;align-items:center;justify-content:space-between;transition:background .1s}
.mi:active{background:rgba(0,0,0,.03)}
.mi:last-child{border-bottom:none}
.mck{width:20px;height:20px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,122,255,.3)}
.mck svg{width:11px;height:11px}

/* ── PULL TO REFRESH ── */
.ptr-wrap{
  position:fixed;top:var(--hh);left:0;right:0;z-index:250;
  display:flex;align-items:center;justify-content:center;
  height:0;overflow:hidden;transition:height .2s ease;
  background:transparent;
}
.ptr-wrap.visible{height:52px}
.ptr-spinner{width:24px;height:24px;border:2.5px solid rgba(0,122,255,.2);border-top-color:var(--blue);border-radius:50%}
.ptr-spinner.spin{animation:spin .7s linear infinite}

/* ── TAB SWITCH ANIMATION ── */
@keyframes tabslide{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.panel.active{animation:tabslide .3s cubic-bezier(.16,1,.3,1)}

/* ── DESKTOP ── */
@media(min-width:1024px){
  .top-tabs{
    display:flex;position:fixed;top:var(--hh);left:0;right:0;z-index:200;
    height:var(--th);
    background:rgba(235,242,252,0.72);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid var(--glass-border);align-items:stretch;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
  }
  .ttab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--t4);font-size:9px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .2s}
  .ttab svg{width:18px;height:18px}
  .ttab.active{color:var(--blue);border-bottom-color:var(--blue)}
  .bottom-nav{display:none}
  .scroll{top:calc(var(--hh) + var(--th));bottom:var(--bbh)}
  .scroll.no-daybar{bottom:0}
  .day-bar{bottom:0}
  .panel{padding:20px 28px 8px;max-width:860px;margin:0 auto}
  .header{padding:0 28px}
}
</style>
</head>

<script>
// ── PULL TO REFRESH ───────────────────────────────
(function initPTR(){
  const scroll = document.getElementById('scrollArea');
  let startY = 0;
  let pulling = false;
  let triggered = false;
  const THRESHOLD = 80; // px to pull before refresh

  scroll.addEventListener('touchstart', e => {
    if(scroll.scrollTop === 0){
      startY = e.touches[0].clientY;
      pulling = true;
      triggered = false;
    }
  }, {passive:true});

  scroll.addEventListener('touchmove', e => {
    if(!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0){pulling=false;return;}

    const wrap = document.getElementById('ptrWrap');
    const spinner = document.getElementById('ptrSpinner');

    if(dy > 10){
      wrap.classList.add('visible');
      // Rotate arrow based on pull distance
      const pct = Math.min(dy / THRESHOLD, 1);
      spinner.style.transform = `rotate(${pct * 360}deg)`;
    }

    if(dy >= THRESHOLD && !triggered){
      triggered = true;
      spinner.classList.add('spin');
      // Haptic feedback if available
      if(navigator.vibrate) navigator.vibrate(10);
    }
  }, {passive:true});

  scroll.addEventListener('touchend', () => {
    if(!pulling) return;
    pulling = false;
    const wrap = document.getElementById('ptrWrap');
    const spinner = document.getElementById('ptrSpinner');

    if(triggered){
      // Refresh current tab
      sheetCache = {}; // clear cache
      kCache = {rows:[]}; eCache = {rows:[]};
      loadTab(curTab);
      // Hide after load
      setTimeout(() => {
        spinner.classList.remove('spin');
        wrap.classList.remove('visible');
      }, 1000);
    } else {
      wrap.classList.remove('visible');
      spinner.classList.remove('spin');
    }
    triggered = false;
  }, {passive:true});
})();

// ── КОНФИГ ────────────────────────────────────────
const BASE = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}`;
const MRU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

// ── STATE ─────────────────────────────────────────
let months=[],curMonth='',curTab='day';
let days=[],dayIdx=0;
let kCache={rows:[]},eCache={rows:[]};
let charts={};
let calView=new Date();
let sheetCache={};

// ── INIT ──────────────────────────────────────────
window.onload=async function(){
  // Logo
  if(LOGO_URL){
    g('appLogo').innerHTML=`<img src="${LOGO_URL}" alt="Logo" onerror="this.parentElement.innerHTML='Расходы'">`;
  }
  // Load sheet list
  try{
    const res=await fetch(`${BASE}?key=${API_KEY}&fields=sheets.properties.title`);
    const data=await res.json();
    if(data.error){
      g('panel-day').innerHTML=`<div class="empty">Ошибка API: ${data.error.message}<br><br>Проверь API ключ и доступ к таблице.</div>`;
      return;
    }
    months=data.sheets.map(s=>s.properties.title).filter(n=>!SKIP.some(s=>n.toLowerCase()===s.toLowerCase()));
    if(!months.length){g('panel-day').innerHTML='<div class="empty">Нет листов</div>';return;}
    // Выбираем месяц по текущей дате
    const now=new Date();
    const curMonthIdx=now.getMonth(); // 0-11
    const curYear=now.getFullYear();
    const monthKw=[['январ'],['феврал'],['март','mar'],['апрел'],['май'],['июн'],['июл'],['август'],['сентябр'],['октябр'],['ноябр'],['декабр']];
    const kw=monthKw[curMonthIdx];
    const found=months.find(m=>{const ml=m.toLowerCase();return ml.includes(String(curYear))&&kw.some(k=>ml.includes(k));});
    curMonth=found||months[months.length-1];
    buildSel();
    switchTab('day');
  }catch(e){
    g('panel-day').innerHTML=`<div class="empty">Ошибка загрузки.<br>${e.message}</div>`;
  }
};

// ── API ───────────────────────────────────────────
async function getSheetData(sheetName){
  if(sheetCache[sheetName])return sheetCache[sheetName];
  const range=encodeURIComponent(`'${sheetName}'`);
  const res=await fetch(`${BASE}/values/${range}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`);
  const data=await res.json();
  const rows=data.values||[];
  sheetCache[sheetName]=rows;
  return rows;
}

function invalidateCache(sheet){delete sheetCache[sheet];}

// ── SELECTORS ─────────────────────────────────────
function buildSel(){
  g('pillTxt').textContent=curMonth;
  g('monthList').innerHTML=months.slice().reverse().map(m=>`
    <div class="mi" onclick="pickMonth('${esc(m)}')">
      <span style="color:${m===curMonth?'var(--blue)':'var(--text)'};font-weight:${m===curMonth?700:400}">${esc(m)}</span>
      ${m===curMonth?`<div class="mck"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2.5"><path d="m1.5 5 2.5 2.5 4.5-4.5"/></svg></div>`:''}
    </div>`).join('');
}
function openMonthModal(){buildSel();g('monthModal').classList.add('open')}
function pickMonth(m){g('monthModal').classList.remove('open');onMonthChange(m)}
function onMonthChange(v){
  curMonth=v;g('pillTxt').textContent=v;
  kCache={rows:[]};eCache={rows:[]};
  loadTab(curTab);
}

// ── TABS ──────────────────────────────────────────
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.ttab,.bnav-tab').forEach(el=>el.classList.remove('active'));
  const tt=g('ttab-'+t);if(tt)tt.classList.add('active');
  const bt=g('btab-'+t);if(bt)bt.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  g('panel-'+t).classList.add('active');
  g('scrollArea').scrollTop=0;
  const isDay=t==='day';
  g('dayBar').style.display=isDay?'flex':'none';
  const sc=g('scrollArea');
  isDay?sc.classList.remove('no-daybar'):sc.classList.add('no-daybar');
  loadTab(t);
}
function loadTab(t){
  if(t==='day')      loadDays();
  if(t==='month')    loadMonthly();
  if(t==='envelope') loadEnvelope();
  if(t==='kassa')    loadKassa();
  if(t==='salary')   loadSalary();
}

// ── ДЕНЬ ─────────────────────────────────────────
async function loadDays(){
  spin('day');
  try{
    const rows=await getSheetData(curMonth);
    days=extractDays(rows,curMonth);
    if(!days.length){g('panel-day').innerHTML='<div class="empty">Нет данных</div>';return;}
    // Restore saved day or default to last day
    const savedIdx=loadDayIdx();
    dayIdx=(savedIdx>=0&&savedIdx<days.length)?savedIdx:days.length-1;
    // Load kassa and envelope FIRST, then render
    const [kd,ed]=await Promise.all([getKassaRows(rows),getEnvRows(rows)]);
    kCache={rows:kd};
    eCache={rows:ed};
    renderDay();
  }catch(e){g('panel-day').innerHTML=`<div class="empty">Ошибка: ${e.message}</div>`;}
}

function extractDays(rows,month){
  const result=[];
  const dateRx=/\d{2}\.\d{2}\.\d{4}/;
  const seen=new Set();
  for(let r=0;r<rows.length;r++){
    for(let c=0;c<(rows[r]||[]).length;c++){
      const cell=String(rows[r][c]||'');
      if(!dateRx.test(cell))continue;
      const dateStr=cell.match(dateRx)[0];
      if(seen.has(dateStr+c))continue;
      seen.add(dateStr+c);
      const dayData={date:dateStr,items:[],total:0};
      for(let dr=r+2;dr<rows.length;dr++){
        const name=String((rows[dr]||[])[c]||'').trim();
        const sum=(rows[dr]||[])[c+1];
        if(name.toLowerCase().includes('итого')){dayData.total=sum||0;break;}
        if(name==='')break;
        if(name&&sum)dayData.items.push({name,sum:fv(sum)});
      }
      result.push(dayData);
    }
  }
  result.sort((a,b)=>{
    const [ad,am,ay]=a.date.split('.');
    const [bd,bm,by]=b.date.split('.');
    return new Date(`${ay}-${am}-${ad}`)-new Date(`${by}-${bm}-${bd}`);
  });
  // Deduplicate by date (keep first occurrence)
  const seen2=new Set();
  return result.filter(d=>{if(seen2.has(d.date))return false;seen2.add(d.date);return true;});
}

function renderDay(){
  const day=days[dayIdx];
  g('dayLabel').textContent=day.date;
  g('dayCnt').textContent='День '+(dayIdx+1)+' из '+days.length+' · выбрать ↑';
  const items=day.items.filter(i=>i.sum&&i.sum!=='0,00');
  // Match by date - compare day/month/year parts individually
  const dayNorm=day.date; // dd.mm.yyyy
  const [dd,dm,dy]=dayNorm.split('.');
  function dateMatch(raw){
    const n=normDate(raw);
    if(n===dayNorm)return true;
    // Compare parts
    const [nd,nm,ny]=n.split('.');
    return nd===dd && nm===dm && ny===dy;
  }
  const kr=kCache.rows?.find(r=>dateMatch(r.date));
  const er=eCache.rows?.find(r=>dateMatch(r.date));

  const topGrid=`
  <div class="sg c2">
    <div class="stat"><div class="stat-l">Расход дня</div><div class="stat-v rd">€${fv(day.total)}</div></div>
    <div class="stat"><div class="stat-l">Позиций</div><div class="stat-v bl">${items.length}</div></div>
  </div>
  <div class="sg c4">
    <div class="stat"><div class="stat-l">Вход</div><div class="stat-v bl" style="font-size:17px">${kr?'€'+kr.open:'—'}</div></div>
    <div class="stat"><div class="stat-l">Доход</div><div class="stat-v gr" style="font-size:17px">${kr?'€'+kr.income:'—'}</div></div>
    <div class="stat"><div class="stat-l">Расход</div><div class="stat-v rd" style="font-size:17px">${kr?'€'+kr.expense:'—'}</div></div>
    <div class="stat"><div class="stat-l">Касса</div><div class="stat-v bl" style="font-size:17px;font-weight:800">${kr?'€'+kr.balance:'—'}</div></div>
  </div>`;

  let rows=items.map(i=>`<div class="lrow"><div class="lname">${esc(i.name)}</div><div class="lval rd">−€${i.sum}</div></div>`).join('');
  let envBlock='';
  if(er){
    envBlock=`<div class="sec">Конверт</div>
    <div class="mini">
      <div class="mini-h"><div class="mini-ic" style="background:rgba(255,149,0,.1)">✉️</div><div class="mini-t">${er.date}</div></div>
      <div class="mini-g mini-g3">
        <div class="mini-c"><div class="mini-l">Приход</div><div class="mini-v gr">€${er.income}</div></div>
        <div class="mini-c"><div class="mini-l">Расход</div><div class="mini-v rd">${er.expense!=='0,00'?'€'+er.expense:'—'}</div></div>
        <div class="mini-c"><div class="mini-l">Итог</div><div class="mini-v or">€${er.total}</div></div>
      </div>
      ${er.reason?`<div style="padding:10px 16px;font-size:13px;color:var(--t3)">Причина: ${esc(er.reason)}</div>`:''}
    </div>`;
  }

  g('panel-day').innerHTML=`${topGrid}<div class="sec">Расходы</div>
  <div class="card">
    ${rows||'<div class="empty">Нет расходов</div>'}
    ${items.length?`<div class="tot-row"><div class="tot-l">Итого</div><div class="tot-v">€${fv(day.total)}</div></div>`:''}
  </div>${envBlock}`;
}

function prevDay(){
  if(dayIdx>0){dayIdx--;renderDay();g('scrollArea').scrollTop=0;saveDayIdx();}
}
function nextDay(){
  if(dayIdx<days.length-1){dayIdx++;renderDay();g('scrollArea').scrollTop=0;saveDayIdx();}
}
function saveDayIdx(){
  try{localStorage.setItem('so_day_'+curMonth, dayIdx);}catch(e){}
}
function loadDayIdx(){
  try{
    const saved=localStorage.getItem('so_day_'+curMonth);
    if(saved!==null) return parseInt(saved);
  }catch(e){}
  return -1; // -1 means use last day
}

// ── CALENDAR ─────────────────────────────────────
function openCalendar(){
  if(!days.length)return;
  const p=days[dayIdx].date.split('.');
  calView=new Date(+p[2],+p[1]-1,1);
  renderCal();g('calModal').classList.add('open');
}
function calGo(d){calView.setMonth(calView.getMonth()+d);renderCal()}
function renderCal(){
  const yr=calView.getFullYear(),mo=calView.getMonth();
  g('calLbl').textContent=MRU[mo]+' '+yr;
  const dataSet=new Set(days.map(d=>d.date));
  const selDate=days[dayIdx].date;
  const dow=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let h=dow.map(d=>`<div class="cdl">${d}</div>`).join('');
  let first=new Date(yr,mo,1).getDay();if(first===0)first=7;
  for(let i=1;i<first;i++)h+=`<div class="cd emp"></div>`;
  const dim=new Date(yr,mo+1,0).getDate();
  for(let d=1;d<=dim;d++){
    const dd=String(d).padStart(2,'0'),mm=String(mo+1).padStart(2,'0');
    const ds=`${dd}.${mm}.${yr}`;
    const has=dataSet.has(ds),sel=ds===selDate;
    const cls=['cd',has?'has':'nodata',sel?'sel':''].filter(Boolean).join(' ');
    h+=`<div class="cdw"><button class="${cls}" onclick="pickDay('${ds}')">${d}</button>${has&&!sel?'<div class="dot"></div>':'<div style="height:6px"></div>'}</div>`;
  }
  g('calGrid').innerHTML=h;
}
async function pickDay(ds){
  g('calModal').classList.remove('open');
  const parts=ds.split('.');
  const moIdx=parseInt(parts[1])-1;
  const yr=parseInt(parts[2]);
  const moKw=[['январ'],['феврал'],['март','mar'],['апрел'],['май'],['июн'],['июл'],['август'],['сентябр'],['октябр'],['ноябр'],['декабр']][moIdx];
  const matched=months.find(m=>{const ml=m.toLowerCase();return ml.includes(String(yr))&&moKw.some(k=>ml.includes(k));});
  if(matched&&matched!==curMonth){
    curMonth=matched;g('pillTxt').textContent=matched;
    kCache={rows:[]};eCache={rows:[]};
    spin('day');
    const rows=await getSheetData(curMonth);
    days=extractDays(rows,curMonth);
    const [kd,ed]=await Promise.all([getKassaRows(rows),getEnvRows(rows)]);
    kCache={rows:kd};eCache={rows:ed};
    const idx=days.findIndex(d=>d.date===ds);
    dayIdx=idx>=0?idx:days.length-1;
    renderDay();return;
  }
  const idx=days.findIndex(d=>d.date===ds);
  if(idx===-1)return;
  dayIdx=idx;saveDayIdx();renderDay();g('scrollArea').scrollTop=0;
}

// ── МЕСЯЦ ────────────────────────────────────────
async function loadMonthly(){
  spin('month');
  try{
    const rows=await getSheetData(curMonth);
    const {cName,cSum,rStart,rEnd,rTotal}=CFG.MONTHLY;
    const items=[];
    for(let r=rStart;r<=rEnd;r++){
      const name=String((rows[r]||[])[cName]||'').trim();
      const sum=(rows[r]||[])[cSum];
      if(name)items.push({name,sum:fv(sum||0)});
    }
    const total=fv((rows[rTotal]||[])[cSum]||0);
    const sorted=[...items].sort((a,b)=>pf(b.sum)-pf(a.sum));
    const top5=sorted.slice(0,5);
    const maxV=pf(top5[0]?.sum||'0')||1;
    const cc=['#007aff','#ff3b30','#34c759','#ff9500','#af52de'];

    let rows2=items.map(i=>`<div class="lrow"><div class="lname">${esc(i.name)}</div><div class="lval rd">€${i.sum}</div></div>`).join('');
    let prog=top5.map((it,i)=>`<div class="prog-i"><div class="prog-top"><div class="prog-n">${esc(it.name)}</div><div class="prog-v">€${it.sum}</div></div><div class="prog-bg"><div class="prog-f" style="width:${Math.round(pf(it.sum)/maxV*100)}%;background:${cc[i]}"></div></div></div>`).join('');

    g('panel-month').innerHTML=`
      <div class="sg c2">
        <div class="stat"><div class="stat-l">Итого за месяц</div><div class="stat-v rd">€${total}</div><div class="stat-s">${curMonth}</div></div>
        <div class="stat"><div class="stat-l">Категорий</div><div class="stat-v bl">${items.filter(i=>pf(i.sum)>0).length}</div></div>
      </div>
      <div class="sec">Структура</div>
      <div class="card"><div class="ch-wrap" style="display:flex;align-items:center;gap:18px">
        <canvas id="dC" width="110" height="110" style="width:110px;height:110px;flex-shrink:0"></canvas>
        <div style="flex:1;min-width:0">${top5.map((it,i)=>`<div style="display:flex;align-items:center;gap:7px;margin-bottom:8px"><div style="width:8px;height:8px;border-radius:2px;background:${cc[i]};flex-shrink:0"></div><div style="font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</div><div style="font-size:13px;font-weight:600;color:${cc[i]}">€${it.sum}</div></div>`).join('')}</div>
      </div></div>
      <div class="sec">Топ расходов</div><div class="card">${prog}</div>
      <div class="sec">Все категории</div>
      <div class="card">${rows2}</div>`;

    setTimeout(()=>{
      const ctx=g('dC');if(!ctx)return;
      if(charts.d)charts.d.destroy();

// ── UTILS ─────────────────────────────────────────
function bgClose(e,id){if(e.target===g(id))g(id).classList.remove('open')}
function spin(t){g('panel-'+t).innerHTML='<div class="loading"><div class="spinner"></div><div class="ltxt">Загрузка...</div></div>'}
function g(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fv(v){const n=parseFloat(String(v||0).replace(',','.'));return isNaN(n)?'0,00':n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pf(s){const n=parseFloat(String(s||'0').replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n}
function normDate(d){
  if(!d)return'';
  // Strip day name suffix like " - среда", " - Monday" etc
  d = String(d).split(' - ')[0].split(' – ')[0].trim();
  // Handle numeric serial date (Google Sheets serial number)
  if(typeof d==='number'||/^\d{5}$/.test(String(d))){
    // Excel/Sheets serial: days since Dec 30, 1899
    const serial=parseInt(d);
    const dt=new Date((serial-25569)*86400*1000);
    return String(dt.getUTCDate()).padStart(2,'0')+'.'+String(dt.getUTCMonth()+1).padStart(2,'0')+'.'+dt.getUTCFullYear();
  }
  const s=String(d).trim();
  // Already dd.mm.yyyy or d.mm.yyyy
  if(/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(s)){
    const p=s.split('.');
    return p[0].padStart(2,'0')+'.'+p[1].padStart(2,'0')+'.'+p[2];
  }
  // Already dd.mm.yy
  if(/^\d{1,2}\.\d{1,2}\.\d{2}$/.test(s)){
    const p=s.split('.');
    return p[0].padStart(2,'0')+'.'+p[1].padStart(2,'0')+'.'+'20'+p[2];
  }
  // ISO yyyy-mm-dd
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    const dt=new Date(s);
    return String(dt.getDate()).padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0')+'.'+dt.getFullYear();
  }
  // Try JS Date parse (handles "30 Apr 2026", etc)
  const dt=new Date(s);
  if(!isNaN(dt.getTime())){
    return String(dt.getDate()).padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0')+'.'+dt.getFullYear();
  }
  // m/d/yyyy slash format
  const p=s.split(/[\/]/);
  if(p.length===3&&p[2].length===4){
    const a=parseInt(p[0]),b=parseInt(p[1]);
    // US format: m/d/yyyy — if a<=12 and b<=31
    if(a<=12&&b>12) return String(b).padStart(2,'0')+'.'+String(a).padStart(2,'0')+'.'+p[2];
    return String(a).padStart(2,'0')+'.'+String(b).padStart(2,'0')+'.'+p[2];
  }
  return s;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
.shake{animation:shake .35s ease}

<script>
// ── LOCK SCREEN LOGIC ──────────────────────────────

const LOCK_KEY   = 'so_pin_hash';
const BIOM_KEY   = 'so_biometrics';
const SETUP_KEY  = 'so_pin_setup';

let pinBuffer = '';
let lockMode  = 'check'; // 'check' | 'setup1' | 'setup2'
let setupFirst = '';

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function initLock(){
  const hasPin = localStorage.getItem(LOCK_KEY);
  const faceBtn = document.getElementById('faceBtn');

  if(!hasPin){
    // Первый запуск — настройка пин-кода
    lockMode = 'setup1';
    document.getElementById('lockSubtitle').textContent = 'Придумайте пароль (4 цифры)';
    faceBtn.style.visibility = 'hidden';
    return;
  }

  // Есть пин — режим проверки
  lockMode = 'check';
  document.getElementById('lockSubtitle').textContent = 'Введите пароль';

  // Проверяем поддержку биометрики
  const biomEnabled = localStorage.getItem(BIOM_KEY) === '1';
  if(biomEnabled && window.PublicKeyCredential){
    faceBtn.textContent = '🔒';
    faceBtn.style.fontSize = '24px';
    setTimeout(tryFaceID, 400); // автозапуск Face ID
  } else {
    faceBtn.style.visibility = 'hidden';
  }
}

function pinInput(digit){
  if(pinBuffer.length >= 4) return;
  pinBuffer += digit;
  updateDots();
  if(pinBuffer.length === 4){
    setTimeout(()=>processPin(), 80);
  }
}

function pinDelete(){
  pinBuffer = pinBuffer.slice(0,-1);
  updateDots();
  document.getElementById('lockError').textContent = '';
}

function updateDots(){
  for(let i=0;i<4;i++){
    const d = document.getElementById('d'+i);
    d.classList.toggle('filled', i < pinBuffer.length);
    d.classList.remove('error');
  }
}

async function processPin(){
  if(lockMode === 'setup1'){
    setupFirst = pinBuffer;
    pinBuffer = '';
    updateDots();
    lockMode = 'setup2';
    document.getElementById('lockSubtitle').textContent = 'Повторите пароль';
    return;
  }

  if(lockMode === 'setup2'){
    if(pinBuffer !== setupFirst){
      showPinError('Пароли не совпадают');
      return;
    }
    // Сохраняем хэш
    const h = await sha256(pinBuffer);
    localStorage.setItem(LOCK_KEY, h);
    localStorage.setItem(SETUP_KEY, '1');
    // Предложить Face ID
    await offerFaceID();
    unlock();
    return;
  }

  // Режим проверки
  const h = await sha256(pinBuffer);
  const saved = localStorage.getItem(LOCK_KEY);
  if(h === saved){
    unlock();
  } else {
    showPinError('Неверный пароль');
  }
}

function showPinError(msg){
  pinBuffer = '';
  updateDots();
  // Красные точки
  for(let i=0;i<4;i++) document.getElementById('d'+i).classList.add('error');
  document.getElementById('lockError').textContent = msg;
  // Тряска
  document.getElementById('pinDots').classList.add('shake');
  setTimeout(()=>{
    document.getElementById('pinDots').classList.remove('shake');
    for(let i=0;i<4;i++) document.getElementById('d'+i).classList.remove('error');
    document.getElementById('lockError').textContent = '';
  }, 600);
}

async function offerFaceID(){
  if(!window.PublicKeyCredential) return;
  const avail = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(()=>false);
  if(!avail) return;

  return new Promise(resolve=>{
    // Простой confirm — iOS покажет нативный диалог
    const ok = confirm('Использовать Face ID / Touch ID для входа?');
    if(ok){
      localStorage.setItem(BIOM_KEY,'1');
    }
    resolve();
  });
}

async function tryFaceID(){
  if(!window.PublicKeyCredential) return;
  try{
    // Используем platform authenticator для верификации
    const avail = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if(!avail) return;

    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);

    const cred = await navigator.credentials.get({
      publicKey:{
        challenge,
        timeout:30000,
        userVerification:'required',
        rpId: window.location.hostname || 'localhost',
      }
    }).catch(()=>null);

    if(cred){
      unlock();
    }
  }catch(e){
    // Пользователь отменил — ничего не делаем
  }
}

function unlock(){
  const ls = document.getElementById('lockScreen');
  ls.style.transition = 'opacity .3s, transform .3s';
  ls.style.opacity = '0';
  ls.style.transform = 'scale(1.04)';
  setTimeout(()=>ls.remove(), 320);
}

// Запуск
initLock();
</script>
