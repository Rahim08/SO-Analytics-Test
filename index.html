<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SO Analytics">
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;SO Analytics&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;start_url&quot;:&quot;.&quot;}">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23007aff'/><text x='50' y='68' font-family='sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'>SO</text></svg>">
<title>SO Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html{font-size:16px;height:100%;-webkit-text-size-adjust:100%}
body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;overflow:hidden;background:#f2f2f7}
:root{
  --bg:#f2f2f7;--surface:#ffffff;--s2:rgba(118,118,128,.12);--s3:rgba(118,118,128,.06);
  --border:rgba(60,60,67,.18);--b2:rgba(60,60,67,.1);
  --text:#1c1c1e;--t2:#3a3a3c;--t3:#6d6d72;--t4:#aeaeb2;
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;
  --hh:56px;--bnh:82px;--bbh:64px;
}

/* HEADER */
.header{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:calc(var(--hh) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(242,242,247,0.95);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding-left:16px;padding-right:16px;
}
.logo{font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.logo img{height:32px;width:32px;object-fit:contain;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.month-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,122,255,0.12);border:1px solid rgba(0,122,255,0.2);
  border-radius:20px;padding:7px 14px;cursor:pointer;
  font-size:15px;font-weight:600;color:var(--blue);font-family:inherit;transition:all .15s;
}
.month-pill:active{opacity:.6;transform:scale(.96)}
.chevron{display:inline-block;width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px}

/* SCROLL */
.scroll{
  position:fixed;left:0;right:0;z-index:1;
  overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  top:calc(var(--hh) + env(safe-area-inset-top,0px));
  bottom:calc(var(--bnh) + env(safe-area-inset-bottom,0px));
}
.scroll.with-daybar{bottom:calc(var(--bnh) + var(--bbh) + env(safe-area-inset-bottom,0px))}
.scroll::-webkit-scrollbar{display:none}
.panel{display:none;padding:16px 16px 8px;animation:up .28s cubic-bezier(.16,1,.3,1)}
.panel.active{display:block}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* BOTTOM NAV — fixed to bottom, respects safe area */
.bottom-nav{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:300;
  height:calc(var(--bnh) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(249,249,249,0.95);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:flex-start;
  padding-top:10px;
}
.bnav-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;color:var(--t4);
  font-size:10.5px;font-weight:600;letter-spacing:.2px;
  border:none;background:none;font-family:inherit;padding:0;
  transition:all .2s cubic-bezier(.16,1,.3,1);
}
.bnav-tab svg{width:26px;height:26px;transition:all .2s cubic-bezier(.16,1,.3,1)}
.bnav-tab.active{color:var(--blue)}
.bnav-tab.active svg{transform:scale(1.12)}

/* DAY BAR */
.day-bar{
  position:fixed;left:0;right:0;z-index:299;
  height:var(--bbh);
  bottom:calc(var(--bnh) + env(safe-area-inset-bottom,0px));
  background:rgba(249,249,249,0.95);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
}
.nav-btn{
  width:44px;height:44px;border-radius:50%;
  background:var(--s2);border:none;color:var(--t2);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .12s;font-family:inherit;flex-shrink:0;
}
.nav-btn:active{opacity:.5;transform:scale(.93)}
.day-center{flex:1;text-align:center;cursor:pointer;padding:4px 0}
.day-main{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.day-sub{font-size:12px;color:var(--blue);margin-top:2px;font-weight:500}

/* CARDS */
.card{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sec{font-size:13px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:18px 4px 8px}
.sec:first-child{padding-top:2px}

/* STATS */
.sg{display:grid;gap:10px;margin-bottom:12px}
.c2{grid-template-columns:1fr 1fr}
.c4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border-radius:14px;padding:16px 14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat-l{font-size:11px;color:var(--t3);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1}
.c4 .stat{padding:14px 10px}
.c4 .stat-v{font-size:17px;letter-spacing:-.4px}
.c4 .stat-l{font-size:10px}
.stat-s{font-size:11px;color:var(--t4);margin-top:5px}
.bl{color:var(--blue)}.gr{color:var(--green)}.rd{color:var(--red)}.or{color:var(--orange)}

/* LIST */
.lrow{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b2);transition:background .1s}
.lrow:last-child{border-bottom:none}
.lrow:active{background:rgba(0,0,0,.03)}
.lname{font-size:17px;color:var(--text);flex:1;padding-right:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lval{font-size:17px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
.lval.rd{color:var(--red)}.lval.gr{color:var(--green)}.lval.bl{color:var(--blue)}.lval.or{color:var(--orange)}

/* TABLE */
.tbl-h{display:grid;padding:9px 16px;background:rgba(118,118,128,.06);border-bottom:1px solid var(--b2);font-size:11px;color:var(--t4);font-weight:600;text-transform:uppercase;letter-spacing:.4px;gap:4px}
.tbl-r{display:grid;padding:13px 16px;border-bottom:1px solid var(--b2);font-size:14px;gap:4px}
.tbl-r:last-child{border-bottom:none}
.kc{grid-template-columns:70px 1fr 1fr 1fr 1fr}
.ic{grid-template-columns:60px 1fr 1fr 1fr}
.sc{grid-template-columns:1fr 80px 80px 80px 80px 80px 90px}

/* TOTAL */
.tot-row{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:rgba(118,118,128,.05);border-top:1px solid var(--b2)}
.tot-l{font-size:13px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.tot-v{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--text)}

/* MINI */
.mini{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mini-h{padding:12px 16px;border-bottom:1px solid var(--b2);display:flex;align-items:center;gap:8px}
.mini-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.mini-t{font-size:15px;font-weight:600;color:var(--text)}
.mini-g{display:grid;gap:1px;background:var(--b2)}
.mini-g3{grid-template-columns:1fr 1fr 1fr}
.mini-c{background:rgba(255,255,255,.6);padding:13px 16px;display:flex;flex-direction:column;gap:4px}
.mini-l{font-size:12px;color:var(--t3)}
.mini-v{font-size:18px;font-weight:700;letter-spacing:-.3px}

/* CHART */
.ch-wrap{padding:12px 16px 16px}

/* PROGRESS */
.prog-i{padding:11px 18px;border-bottom:1px solid var(--b2)}
.prog-i:last-child{border-bottom:none}
.prog-top{display:flex;justify-content:space-between;margin-bottom:7px}
.prog-n{font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%}
.prog-v{font-size:15px;font-weight:600;color:var(--t2)}
.prog-bg{height:5px;background:var(--s2);border-radius:3px;overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .9s cubic-bezier(.16,1,.3,1)}

/* SALARY */
.sal-r{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b2)}
.sal-r:last-child{border-bottom:none}
.sal-av{width:40px;height:40px;border-radius:50%;background:rgba(0,122,255,.12);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--blue);margin-right:14px;flex-shrink:0;border:1px solid rgba(0,122,255,.2)}
.sal-nm{font-size:17px;color:var(--text)}
.sal-v{font-size:22px;font-weight:700;color:var(--blue);letter-spacing:-.5px}
.sal-lb{font-size:11px;color:var(--t4);text-align:right}
.sal-sub{font-size:12px;color:var(--t3);margin-top:2px}

/* LOADING / EMPTY */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px}
.spinner{width:32px;height:32px;border:2.5px solid rgba(0,122,255,.15);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-size:15px;color:var(--t4)}
.empty{padding:48px 20px;text-align:center;color:var(--t4);font-size:16px}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.25);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:0 0 32px;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,0,.67,0);max-height:88vh;overflow-y:auto;box-shadow:0 -2px 20px rgba(0,0,0,.12)}
.overlay.open .sheet{transform:translateY(0);transition:transform .35s cubic-bezier(.16,1,.3,1)}
.handle{width:36px;height:4px;background:rgba(60,60,67,.2);border-radius:2px;margin:12px auto 0}
.sh-title{font-size:18px;font-weight:700;text-align:center;padding:14px 20px 0;color:var(--text)}

/* CALENDAR */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 10px 10px}
.cdl{text-align:center;font-size:11px;font-weight:600;color:var(--t4);padding:3px 0 8px;text-transform:uppercase}
.cdw{display:flex;flex-direction:column;align-items:center}
.cd{aspect-ratio:1;width:100%;max-width:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px;color:var(--text);cursor:pointer;border:none;background:none;font-family:inherit;transition:all .12s}
.cd.has{font-weight:600}
.cd.sel{background:var(--blue)!important;color:#fff!important;font-weight:700;box-shadow:0 2px 12px rgba(0,122,255,.4)}
.cd.emp{visibility:hidden;pointer-events:none}
.cd.nodata{color:var(--t4)}
.dot{width:4px;height:4px;border-radius:50%;background:var(--blue);margin:2px auto 0}

/* MONTH LIST */
.mi{padding:16px 20px;font-size:17px;cursor:pointer;border-bottom:1px solid var(--b2);display:flex;align-items:center;justify-content:space-between;transition:background .1s}
.mi:active{background:rgba(0,0,0,.03)}
.mi:last-child{border-bottom:none}
.mck{width:20px;height:20px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,122,255,.3)}
.mck svg{width:11px;height:11px}

/* PULL TO REFRESH */
.ptr-wrap{position:fixed;top:calc(var(--hh) + env(safe-area-inset-top,0px));left:0;right:0;z-index:250;display:flex;align-items:center;justify-content:center;height:0;overflow:hidden;transition:height .2s ease}
.ptr-wrap.visible{height:52px}
.ptr-spinner{width:24px;height:24px;border:2.5px solid rgba(0,122,255,.2);border-top-color:var(--blue);border-radius:50%}
.ptr-spinner.spin{animation:spin .7s linear infinite}

/* DARK MODE */
body.dark{background:#1c1c1e}
body.dark .header{background:#1c1c1e!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-bottom-color:rgba(255,255,255,.1)!important}
body.dark .bottom-nav{background:#1c1c1e!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-top-color:rgba(255,255,255,.1)!important}
body.dark .day-bar{background:#1c1c1e!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-top-color:rgba(255,255,255,.1)!important}
body.dark .card,.body.dark .stat,.body.dark .mini{background:#2c2c2e;box-shadow:none}
body.dark .stat{background:#2c2c2e;box-shadow:none}
body.dark .mini{background:#2c2c2e;box-shadow:none}
body.dark .sheet{background:#2c2c2e}
body.dark .overlay{background:rgba(0,0,0,.5)}
body.dark{--text:#ffffff;--t2:#ebebf5;--t3:#aeaeb2;--t4:#636366;--b2:rgba(255,255,255,.1);--s2:rgba(255,255,255,.08);--bg:#1c1c1e;--surface:#2c2c2e}
body.dark .lrow:active{background:rgba(255,255,255,.04)}
body.dark .mini-c{background:rgba(255,255,255,.04)}
body.dark .bnav-tab{color:#636366}
body.dark .bnav-tab.active{color:#0a84ff}
body.dark .month-pill{background:rgba(10,132,255,.15);border-color:rgba(10,132,255,.3);color:#0a84ff}
body.dark .nav-btn{background:rgba(255,255,255,.08);color:#ebebf5}
body.dark .cd{color:#ebebf5}
body.dark .cd.nodata{color:#48484a}
body.dark .handle{background:rgba(255,255,255,.2)}
body.dark .mck{background:#0a84ff}
body.dark .tbl-h{background:rgba(255,255,255,.04)}

/* HEADER THEME */
.header-dark{background:#1c1c1e!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-bottom-color:rgba(255,255,255,.1)!important}
.header-light{background:rgba(242,242,247,0.95)!important;backdrop-filter:saturate(180%) blur(20px)!important;-webkit-backdrop-filter:saturate(180%) blur(20px)!important;border-bottom-color:rgba(60,60,67,.18)!important}

/* DESKTOP */
@media(min-width:1024px){
  .bottom-nav{display:none}
  .scroll{top:calc(var(--hh) + 50px);bottom:var(--bbh)}
  .scroll.with-daybar{bottom:var(--bbh)}
  .day-bar{bottom:0}
  .panel{padding:20px 28px 8px;max-width:860px;margin:0 auto}
  .header{padding:0 28px}
}
</style>
</head>

<!-- SPLASH -->
<div id="splashScreen" style="position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:15%;background:#f2f2f7;transition:opacity .35s ease">
  <div id="splashLogo" style="width:120px;height:120px;border-radius:28px;overflow:hidden;box-shadow:0 8px 32px rgba(0,122,255,.3);opacity:0;transform:scale(0.85);transition:opacity .4s ease,transform .4s cubic-bezier(.16,1,.3,1)">
    <svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#007aff"/>
      <text x="50" y="68" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">SO</text>
    </svg>
  </div>
  <div id="splashFooter" style="position:absolute;bottom:env(safe-area-inset-bottom,28px);left:0;right:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s ease .2s">
    <span style="font-size:13px;font-weight:500;color:#6d6d72;letter-spacing:1.5px;text-transform:uppercase">Analytics</span>
  </div>
</div>

<script>
(function(){
  const isDark = localStorage.getItem('so_dark')==='1';
  const splash = document.getElementById('splashScreen');
  const logo = document.getElementById('splashLogo');
  if(isDark){ splash.style.background='#000'; document.body.classList.add('dark'); }
  setTimeout(()=>{ logo.style.opacity='1'; logo.style.transform='scale(1)'; document.getElementById('splashFooter').style.opacity='1'; },80);
  setTimeout(()=>{ splash.style.opacity='0'; setTimeout(()=>{if(splash)splash.remove();},350); },1600);
})();
</script>

<!-- DAY BAR -->
<div class="day-bar" id="dayBar">

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>День
  </button>

  </button>
  <button class="bnav-tab" onclick="switchTab('inkassa')" id="btab-inkassa">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="m4 4 8 8 8-8"/></svg>Инкасс.
  </button>
  <button class="bnav-tab" onclick="switchTab('kassa')" id="btab-kassa">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8L2 7h20z"/></svg>Касса
  </button>
  <button class="bnav-tab" onclick="switchTab('salary')" id="btab-salary">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Зарплаты
  </button>
</div>

<!-- MONTH MODAL -->
<div class="overlay" id="monthModal" onclick="bgClose(event,'monthModal')">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sh-title">Выбор месяца</div>
    <div id="monthList" style="padding:8px 0"></div>
  </div>
</div>

<!-- CALENDAR MODAL -->
<div class="overlay" id="calModal" onclick="bgClose(event,'calModal')">
  <div class="sheet">
    <div class="handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px">
      <div id="calLbl" style="font-size:17px;font-weight:700;color:var(--text)"></div>
      <div style="display:flex;gap:8px">
        <button onclick="calGo(-1)" style="width:30px;height:30px;border-radius:50%;background:var(--s2);border:none;font-size:16px;color:var(--t2);cursor:pointer;font-family:inherit">‹</button>
        <button onclick="calGo(1)" style="width:30px;height:30px;border-radius:50%;background:var(--s2);border:none;font-size:16px;color:var(--t2);cursor:pointer;font-family:inherit">›</button>
      </div>
    </div>
    <div id="calGrid" class="cg" style="padding:0 10px 16px"></div>
  </div>
</div>

<script>
// ── КОНФИГ ──────────────────────────────────────────────────────
const BASE = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}`;
const MRU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

// ── STATE ────────────────────────────────────────────────────────
let months=[],curMonth='',curTab='day';
let days=[],dayIdx=0;
let sheetCache={};
let charts={};
let calView=new Date();

// ── INIT ─────────────────────────────────────────────────────────
window.onload=async function(){
  loadDarkMode();
  try{
    const res=await fetch(`${BASE}?key=${API_KEY}&fields=sheets.properties.title`);
    const data=await res.json();
    if(data.error){g('panel-day').innerHTML=`<div class="empty">Ошибка API: ${data.error.message}</div>`;return;}
    months=data.sheets.map(s=>s.properties.title).filter(n=>!SKIP.some(s=>n.toLowerCase()===s.toLowerCase()));
    if(!months.length){g('panel-day').innerHTML='<div class="empty">Нет листов</div>';return;}
    const now=new Date();
    const moIdx=now.getMonth();
    const yr=now.getFullYear();
    const kw=[['январ'],['феврал'],['март','mar'],['апрел'],['май'],['июн'],['июл'],['август'],['сентябр'],['октябр'],['ноябр'],['декабр']][moIdx];
    const found=months.find(m=>{const ml=m.toLowerCase();return ml.includes(String(yr))&&kw.some(k=>ml.includes(k));});
    curMonth=found||months[months.length-1];
    buildSel();
    switchTab('day');
  }catch(e){g('panel-day').innerHTML=`<div class="empty">Ошибка: ${e.message}</div>`;}
};

// ── API ──────────────────────────────────────────────────────────
async function getSheetData(sheetName){
  if(sheetCache[sheetName])return sheetCache[sheetName];
  const range=encodeURIComponent(`'${sheetName}'`);
  const res=await fetch(`${BASE}/values/${range}?key=${API_KEY}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`);
  const data=await res.json();
  const rows=data.values||[];
  sheetCache[sheetName]=rows;
  return rows;
}

// ── FIND SECTION ─────────────────────────────────────────────────
function findSection(rows, keyword){
  for(let r=0;r<rows.length;r++){
    const row=rows[r]||[];
    for(let c=0;c<row.length;c++){
      if(String(row[c]||'').toUpperCase().includes(keyword.toUpperCase()))return r;
    }
  }
  return -1;
}

// ── SELECTORS ────────────────────────────────────────────────────
function buildSel(){
  g('pillTxt').textContent=curMonth;
  g('monthList').innerHTML=months.slice().reverse().map(m=>`
    <div class="mi" onclick="pickMonth('${esc(m)}')">
      <span style="color:${m===curMonth?'var(--blue)':'var(--text)'};font-weight:${m===curMonth?700:400}">${esc(m)}</span>
      ${m===curMonth?`<div class="mck"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2.5"><path d="m1.5 5 2.5 2.5 4.5-4.5"/></svg></div>`:''}
    </div>`).join('');
}
function openMonthModal(){buildSel();g('monthModal').classList.add('open')}
function pickMonth(m){g('monthModal').classList.remove('open');curMonth=m;g('pillTxt').textContent=m;sheetCache={};loadTab(curTab);}

// ── TABS ─────────────────────────────────────────────────────────
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.bnav-tab').forEach(el=>el.classList.remove('active'));
  const bt=g('btab-'+t);if(bt)bt.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  g('panel-'+t).classList.add('active');
  g('scrollArea').scrollTop=0;
  const isDay=t==='day';
  g('dayBar').style.display=isDay?'flex':'none';
  g('scrollArea').classList.toggle('with-daybar',isDay);
  loadTab(t);
}
function loadTab(t){
  if(t==='day')loadDays();
  if(t==='month')loadMonthly();
  if(t==='inkassa')loadInkassa();
  if(t==='kassa')loadKassa();
  if(t==='salary')loadSalary();
}

// ── ДЕНЬ ─────────────────────────────────────────────────────────
async function loadDays(){
  spin('day');
  try{
    const rows=await getSheetData(curMonth);
    days=extractDays(rows);
    if(!days.length){g('panel-day').innerHTML='<div class="empty">Нет данных</div>';return;}
    const saved=loadDayIdx();
    dayIdx=(saved>=0&&saved<days.length)?saved:days.length-1;
    renderDay(rows);
  }catch(e){g('panel-day').innerHTML=`<div class="empty">Ошибка: ${e.message}</div>`;}
}

function extractDays(rows){
  const result=[];
  const dateRx=/(\d{2}\.\d{2}\.\d{4})/;
  const seen=new Set();
  for(let r=0;r<rows.length;r++){
    const row=rows[r]||[];
    for(let c=0;c<row.length;c++){
      const cell=String(row[c]||'');
      const match=cell.match(dateRx);
      if(!match)continue;
      const ds=match[1];
      const key=ds+'_'+c;
      if(seen.has(key))continue;
      seen.add(key);
      // Collect items from next rows in this column block
      const items=[];
      let total=0;
      for(let dr=r+2;dr<Math.min(r+60,rows.length);dr++){
        const name=String((rows[dr]||[])[c]||'').trim();
        const sum=(rows[dr]||[])[c+1];
        if(name.toLowerCase().includes('итого')){total=sum||0;break;}
        if(!name)break;
        if(name&&sum!=null&&sum!=='')items.push({name,sum:parseFloat(String(sum).replace(',','.'))});
      }
      result.push({date:ds,col:c,headerRow:r,items,total:parseFloat(String(total).replace(',','.'))||0});
    }
  }
  // Sort by date, deduplicate
  result.sort((a,b)=>{
    const [ad,am,ay]=a.date.split('.');const [bd,bm,by]=b.date.split('.');
    return new Date(`${ay}-${am}-${ad}`)-new Date(`${by}-${bm}-${bd}`);
  });
  const seen2=new Set();
  return result.filter(d=>{if(seen2.has(d.date))return false;seen2.add(d.date);return true;});
}

async function renderDay(rows){
  if(!rows)rows=await getSheetData(curMonth);
  const day=days[dayIdx];
  g('dayLabel').textContent=day.date;
  g('dayCnt').textContent='День '+(dayIdx+1)+' из '+days.length+' · выбрать ↑';

  // Get kassa for this day
  let kr=null;
  const kassaStart=findSection(rows,'КАССА');
  if(kassaStart>=0){
    for(let r=kassaStart+2;r<Math.min(kassaStart+80,rows.length);r++){
      const row=rows[r]||[];
      // КАССА: cDate=col12, cIn=col13, cIncome=col15, cExpense=col16, cBalance=col17 (0-indexed)
      const cellDate=normDate(row[12]);
      if(cellDate===day.date){
        kr={open:fv(row[13]||0),income:fv(row[15]||0),expense:fv(row[16]||0),balance:fv(row[17]||0)};
        break;
      }
    }
  }

  // Get inkassa for this day
  let inkVal=null;
  const inkStart=findSection(rows,'ИНКАССАЦИ');
  if(inkStart>=0){
    for(let r=inkStart+2;r<Math.min(inkStart+80,rows.length);r++){
      const row=rows[r]||[];
      // ИНКАСС: cDate=col4, cIncome=col5, cExpense=col7(причина), cTotal=col8 (0-indexed)
      const cellDate=normDate(row[4]);
      if(cellDate===day.date){inkVal={sum:fv(row[5]||0),reason:row[7]||'',total:fv(row[8]||0)};break;}
    }
  }

  const items=day.items.filter(i=>i.sum&&i.sum!==0);
  let rows2=items.map(i=>`<div class="lrow"><div class="lname">${esc(i.name)}</div><div class="lval rd">−€${fv(i.sum)}</div></div>`).join('');

  let inkBlock='';
  if(inkVal&&(parseFloat(String(inkVal.sum).replace(',','.'))||0)>0){
    inkBlock=`<div class="sec">Инкассация</div>
    <div class="mini">
      <div class="mini-h"><div class="mini-ic" style="background:rgba(255,149,0,.1)">✉️</div><div class="mini-t">${day.date}</div></div>
      <div class="mini-g mini-g3">
        <div class="mini-c"><div class="mini-l">Сумма</div><div class="mini-v or">€${inkVal.sum}</div></div>
        <div class="mini-c"><div class="mini-l">Накопл.</div><div class="mini-v or">€${inkVal.total}</div></div>
        <div class="mini-c"><div class="mini-l">Причина</div><div class="mini-v" style="font-size:13px;color:var(--t3)">${esc(inkVal.reason)||'—'}</div></div>
      </div>
    </div>`;
  }

  const topGrid=`
  <div class="sg c2">
    <div class="stat"><div class="stat-l">Расход дня</div><div class="stat-v rd">€${fv(day.total)}</div></div>
    <div class="stat"><div class="stat-l">Позиций</div><div class="stat-v bl">${items.length}</div></div>
  </div>
  <div class="sg c4">
    <div class="stat"><div class="stat-l">Вход</div><div class="stat-v bl" style="font-size:17px">${kr?'€'+kr.open:'—'}</div></div>
    <div class="stat"><div class="stat-l">Доход</div><div class="stat-v gr" style="font-size:17px">${kr?'€'+kr.income:'—'}</div></div>
    <div class="stat"><div class="stat-l">Расход</div><div class="stat-v rd" style="font-size:17px">${kr?'€'+kr.expense:'—'}</div></div>
    <div class="stat"><div class="stat-l">Касса</div><div class="stat-v bl" style="font-size:17px;font-weight:800">${kr?'€'+kr.balance:'—'}</div></div>
  </div>`;

  g('panel-day').innerHTML=`${topGrid}
  <div class="sec">Расходы</div>
  <div class="card">
    ${rows2||'<div class="empty" style="padding:24px">Нет расходов</div>'}
    ${items.length?`<div class="tot-row"><div class="tot-l">Итого</div><div class="tot-v">€${fv(day.total)}</div></div>`:''}
  </div>${inkBlock}`;
}

function prevDay(){if(dayIdx>0){dayIdx--;renderDay();g('scrollArea').scrollTop=0;saveDayIdx();}}
function nextDay(){if(dayIdx<days.length-1){dayIdx++;renderDay();g('scrollArea').scrollTop=0;saveDayIdx();}}
function saveDayIdx(){try{localStorage.setItem('so_day_'+curMonth,dayIdx);}catch(e){}}
function loadDayIdx(){try{const s=localStorage.getItem('so_day_'+curMonth);if(s!==null)return parseInt(s);}catch(e){}return -1;}

// ── КАЛЕНДАРЬ ────────────────────────────────────────────────────
function openCalendar(){
  if(!days.length)return;
  const p=days[dayIdx].date.split('.');
  calView=new Date(+p[2],+p[1]-1,1);
  renderCal();g('calModal').classList.add('open');
}
function calGo(d){calView.setMonth(calView.getMonth()+d);renderCal();}
function renderCal(){
  const yr=calView.getFullYear(),mo=calView.getMonth();
  g('calLbl').textContent=MRU[mo]+' '+yr;
  const dataSet=new Set(days.map(d=>d.date));
  const selDate=days[dayIdx].date;
  const dow=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let h=dow.map(d=>`<div class="cdl">${d}</div>`).join('');
  let first=new Date(yr,mo,1).getDay();if(first===0)first=7;
  for(let i=1;i<first;i++)h+=`<div class="cd emp"></div>`;
  const dim=new Date(yr,mo+1,0).getDate();
  for(let d=1;d<=dim;d++){
    const dd=String(d).padStart(2,'0'),mm=String(mo+1).padStart(2,'0');
    const ds=`${dd}.${mm}.${yr}`;
    const has=dataSet.has(ds),sel=ds===selDate;
    const cls=['cd',has?'has':'nodata',sel?'sel':''].filter(Boolean).join(' ');
    h+=`<div class="cdw"><button class="${cls}" onclick="pickDay('${ds}')">${d}</button>${has&&!sel?'<div class="dot"></div>':'<div style="height:6px"></div>'}</div>`;
  }
  g('calGrid').innerHTML=h;
}
async function pickDay(ds){
  g('calModal').classList.remove('open');
  const [dd,mm,yyyy]=ds.split('.');
  const moIdx=parseInt(mm)-1;
  const yr=parseInt(yyyy);
  const kw=[['январ'],['феврал'],['март','mar'],['апрел'],['май'],['июн'],['июл'],['август'],['сентябр'],['октябр'],['ноябр'],['декабр']][moIdx];
  const matched=months.find(m=>{const ml=m.toLowerCase();return ml.includes(String(yr))&&kw.some(k=>ml.includes(k));});
  if(matched&&matched!==curMonth){
    curMonth=matched;g('pillTxt').textContent=matched;sheetCache={};
    spin('day');
    const rows=await getSheetData(curMonth);
    days=extractDays(rows);
    const idx=days.findIndex(d=>d.date===ds);
    dayIdx=idx>=0?idx:days.length-1;
    renderDay(rows);return;
  }
  const idx=days.findIndex(d=>d.date===ds);
  if(idx===-1)return;
  dayIdx=idx;saveDayIdx();renderDay();g('scrollArea').scrollTop=0;
}

// ── МЕСЯЦ (ОБЩИЕ РАСХОДЫ) ───────────────────────────────────────
async function loadMonthly(){
  spin('month');
  try{
    const rows=await getSheetData(curMonth);
    const start=findSection(rows,'ОБЩИЕ РАСХОДЫ');
    if(start<0){g('panel-month').innerHTML='<div class="empty">Блок "Общие расходы" не найден</div>';return;}
    // Header row at start+1, data from start+2
    const items=[];
    let total=0;
    for(let r=start+2;r<rows.length;r++){
      const row=rows[r]||[];
      const name=String(row[0]||'').trim();
      const sum=row[1];
      if(!name)break;
      if(name.toLowerCase().includes('итого')){total=sum||0;break;}
      if(sum!=null&&sum!=='')items.push({name,sum:parseFloat(String(sum).replace(',','.'))||0});
    }
    const sorted=[...items].sort((a,b)=>b.sum-a.sum);
    const top5=sorted.slice(0,5);
    const maxV=top5[0]?.sum||1;
    const cc=['#007aff','#ff3b30','#34c759','#ff9500','#af52de'];
    let prog=top5.map((it,i)=>`<div class="prog-i"><div class="prog-top"><div class="prog-n">${esc(it.name)}</div><div class="prog-v">€${fv(it.sum)}</div></div><div class="prog-bg"><div class="prog-f" style="width:${Math.round(it.sum/maxV*100)}%;background:${cc[i]}"></div></div></div>`).join('');
    let rows2=items.map(i=>`<div class="lrow"><div class="lname">${esc(i.name)}</div><div class="lval rd">€${fv(i.sum)}</div></div>`).join('');
    const totalVal=fv(typeof total==='number'?total:0);
    g('panel-month').innerHTML=`
      <div class="sg c2">
        <div class="stat"><div class="stat-l">Итого за месяц</div><div class="stat-v rd">€${totalVal}</div><div class="stat-s">${curMonth}</div></div>
        <div class="stat"><div class="stat-l">Категорий</div><div class="stat-v bl">${items.filter(i=>i.sum>0).length}</div></div>
      </div>
      <div class="sec">Топ расходов</div><div class="card">${prog}</div>
      <div class="sec">Все категории</div>
      <div class="card">${rows2}<div class="tot-row"><div class="tot-l">Итого</div><div class="tot-v">€${totalVal}</div></div></div>`;
  }catch(e){g('panel-month').innerHTML=`<div class="empty">Ошибка: ${e.message}</div>`;}
}

// ── ИНКАССАЦИИ ───────────────────────────────────────────────────
async function loadInkassa(){
  spin('inkassa');
  try{
    const rows=await getSheetData(curMonth);
    const start=findSection(rows,'ИНКАССАЦИ');
    if(start<0){g('panel-inkassa').innerHTML='<div class="empty">Блок инкассаций не найден</div>';return;}

    // Get salary data to calculate daily FOT (5/7 schedule)
    const salStart=findSection(rows,'СМЕНЫ И ЗАРПЛАТЫ');
    let totalFOT=0;
    const employeeFOT=[];
    if(salStart>=0){
      for(let r=salStart+2;r<rows.length;r++){
        const row=rows[r]||[];
        const name=String(row[20]||'').trim();
        if(!name)break;
        if(name.toLowerCase().includes('итого'))break;
        const zp=parseFloat(String(row[21]||0).replace(',','.'))||0;
        const propuski=parseInt(row[23])||0;
        totalFOT+=zp;
        employeeFOT.push({name,zp,propuski});
      }
    }
    // Calculate FOT accumulated by last inkassa date (5/7 daily rate)
    const lastData=data[data.length-1];
    function fotByDate(dateStr){
      if(!dateStr||!totalFOT)return 0;
      const [dd]=dateStr.split('.');
      const dayNum=parseInt(dd);
      // 5/7 days per week = daily rate multiplier
      return totalFOT*(dayNum*(5/7))/30;
    }

    const data=[];
    for(let r=start+2;r<rows.length;r++){
      const row=rows[r]||[];
      // ИНКАСС: cDate=col4, cIncome=col5, cExpense=col7(причина/расход), cTotal=col8 (0-indexed)
      const ds=normDate(row[4]);
      if(!ds)break;
      const sum=parseFloat(String(row[5]||0).replace(',','.'))||0;
      const reason=String(row[7]||'');
      const cumul=parseFloat(String(row[8]||0).replace(',','.'))||0;
      data.push({date:ds,sum,reason,cumul});
    }

    if(!data.length){g('panel-inkassa').innerHTML='<div class="empty">Нет данных</div>';return;}

    const last=data[data.length-1];
    const activeRows=data.filter(r=>r.sum>0);
    const labels=data.map(r=>r.date.slice(0,5));
    const totals=data.map(r=>r.cumul);

    let trows=data.map(r=>`<div class="tbl-r ic">
      <span style="color:var(--t3)">${r.date.slice(0,5)}</span>
      <span style="color:var(--orange);font-weight:600">${r.sum>0?'€'+fv(r.sum):'—'}</span>
      <span style="color:var(--t3);font-size:12px">${r.reason||'—'}</span>
      <span style="color:var(--orange);font-weight:700">€${fv(r.cumul)}</span>
    </div>`).join('');

    // FOT comparison card - FOT accumulated to date of last inkassa
    const fotToDate=fotByDate(last.date);
    const fotCard=totalFOT>0?`
      <div class="sg c2" style="margin-top:0">
        <div class="stat"><div class="stat-l">Инкасс. накопл.</div><div class="stat-v or">€${fv(last.cumul)}</div></div>
        <div class="stat"><div class="stat-l">ФОТ к ${last.date.slice(0,5)}</div><div class="stat-v bl">≈€${fv(fotToDate)}</div></div>
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="lrow">
          <div class="lname">Покрытие ФОТ</div>
          <div class="lval ${last.cumul>=fotToDate?'gr':'rd'}">${fotToDate>0?Math.round(last.cumul/fotToDate*100):0}%</div>
        </div>
        <div class="lrow">
          <div class="lname">Остаток к инкасс.</div>
          <div class="lval ${fotToDate-last.cumul<=0?'gr':'or'}">€${fv(Math.max(0,fotToDate-last.cumul))}</div>
        </div>
        <div class="lrow">
          <div class="lname">ФОТ за весь месяц</div>
          <div class="lval bl">€${fv(totalFOT)}</div>
        </div>
      </div>`:'';    g('panel-inkassa').innerHTML=`
      <div class="sg c2">
        <div class="stat"><div class="stat-l">Баланс накопл.</div><div class="stat-v or">€${fv(last.cumul)}</div></div>
        <div class="stat"><div class="stat-l">Операций</div><div class="stat-v bl">${activeRows.length}</div></div>
      </div>
      ${fotCard}
      <div class="sec">Динамика</div>
      <div class="card"><div class="ch-wrap"><canvas id="iC" style="max-height:130px"></canvas></div></div>
      <div class="sec">По дням</div>
      <div class="card"><div class="tbl-h ic"><span>Дата</span><span>Сумма</span><span>Причина</span><span>Накопл.</span></div>${trows}</div>`;

    setTimeout(()=>{
      const ctx=g('iC');if(!ctx)return;
      if(charts.i)charts.i.destroy();
      charts.i=new Chart(ctx,{type:'line',data:{labels,datasets:[{data:totals,borderColor:'#ff9500',backgroundColor:'rgba(255,149,0,.07)',borderWidth:2,pointRadius:2,fill:true,tension:.4}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#aeaeb2',font:{size:10},maxTicksLimit:8},grid:{color:'rgba(60,60,67,.06)'}},y:{ticks:{color:'#aeaeb2',font:{size:10},callback:v=>'€'+v},grid:{color:'rgba(60,60,67,.06)'}}}}});
    },80);
  }catch(e){g('panel-inkassa').innerHTML=`<div class="empty">Ошибка: ${e.message}</div>`;}
}

// ── КАССА ────────────────────────────────────────────────────────
async function loadKassa(){
  spin('kassa');
  try{
    const rows=await getSheetData(curMonth);
    const start=findSection(rows,'КАССА');
    if(start<0){g('panel-kassa').innerHTML='<div class="empty">Блок кассы не найден</div>';return;}

    const data=[];
    for(let r=start+2;r<rows.length;r++){
      const row=rows[r]||[];
      // КАССА: cDate=col12, cIn=col13, cIncome=col15, cExpense=col16, cBalance=col17 (0-indexed)
      const ds=normDate(row[12]);
      if(!ds)break;
      const open=parseFloat(String(row[13]||0).replace(',','.'))||0;
      const income=parseFloat(String(row[15]||0).replace(',','.'))||0;
      const expense=parseFloat(String(row[16]||0).replace(',','.'))||0;
      const balance=parseFloat(String(row[17]||0).replace(',','.'))||0;
      if(income>0||expense>0||balance>0)data.push({date:ds,open,income,expense,balance});
    }

    if(!data.length){g('panel-kassa').innerHTML='<div class="empty">Нет данных</div>';return;}
    const last=data[data.length-1];
    const labels=data.map(r=>r.date.slice(0,5));
    const inc=data.map(r=>r.income);
    const exp=data.map(r=>r.expense);

    let krows=data.map(r=>`<div class="tbl-r kc">
      <span style="color:var(--t3)">${r.date.slice(0,5)}</span>
      <span style="color:var(--blue)">${r.open?'€'+fv(r.open):'—'}</span>
      <span style="color:var(--green);font-weight:600">€${fv(r.income)}</span>
      <span style="color:var(--red)">€${fv(r.expense)}</span>
      <span style="color:var(--blue);font-weight:700">€${fv(r.balance)}</span>
    </div>`).join('');

    g('panel-kassa').innerHTML=`
      <div class="sg c2">
        <div class="stat"><div class="stat-l">Остаток</div><div class="stat-v bl">€${fv(last.balance)}</div><div class="stat-s">${last.date}</div></div>
        <div class="stat"><div class="stat-l">Доход посл.</div><div class="stat-v gr">€${fv(last.income)}</div><div class="stat-s">${last.date}</div></div>
      </div>
      <div class="sec">Доходы и расходы</div>
      <div class="card"><div class="ch-wrap"><canvas id="kC" style="max-height:130px"></canvas></div></div>
      <div class="sec">По дням</div>
      <div class="card"><div class="tbl-h kc"><span>Дата</span><span>Вход</span><span>Доход</span><span>Расход</span><span>Касса</span></div>${krows}</div>`;

    setTimeout(()=>{
      const ctx=g('kC');if(!ctx)return;
      if(charts.k)charts.k.destroy();
      charts.k=new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Доход',data:inc,backgroundColor:'rgba(52,199,89,.75)',borderRadius:4},{label:'Расход',data:exp,backgroundColor:'rgba(255,59,48,.7)',borderRadius:4}]},options:{responsive:true,plugins:{legend:{labels:{color:'#6d6d72',font:{size:11},boxWidth:10}}},scales:{x:{ticks:{color:'#aeaeb2',font:{size:9},maxTicksLimit:8},grid:{display:false}},y:{ticks:{color:'#aeaeb2',font:{size:9},callback:v=>'€'+v},grid:{color:'rgba(60,60,67,.06)'}}}}});
    },80);
  }catch(e){g('panel-kassa').innerHTML=`<div class="empty">Ошибка: ${e.message}</div>`;}
}

// ── ЗАРПЛАТЫ ─────────────────────────────────────────────────────
async function loadSalary(){
  spin('salary');
  try{
    const rows=await getSheetData(curMonth);
    const start=findSection(rows,'СМЕНЫ И ЗАРПЛАТЫ');
    if(start<0){g('panel-salary').innerHTML='<div class="empty">Блок зарплат не найден</div>';return;}

    const data=[];
    let totalZP=0,totalPay=0;
    for(let r=start+2;r<rows.length;r++){
      const row=rows[r]||[];
      // SALARY: cName=col20, cShifts=col21, + additional cols 0-indexed
      const name=String(row[20]||'').trim();
      if(!name)break;
      if(name.toLowerCase().includes('итого')){
        totalZP=parseFloat(String(row[21]||0).replace(',','.'))||0;
        totalPay=parseFloat(String(row[26]||0).replace(',','.'))||0;
        break;
      }
      const zp=parseFloat(String(row[21]||0).replace(',','.'))||0;
      const vychet=parseFloat(String(row[22]||0).replace(',','.'))||0;
      const propuski=parseInt(row[23])||0;
      const itogVychet=parseFloat(String(row[24]||0).replace(',','.'))||0;
      const naKartu=parseFloat(String(row[25]||0).replace(',','.'))||0;
      const kVydache=parseFloat(String(row[26]||0).replace(',','.'))||0;
      data.push({name,zp,vychet,propuski,itogVychet,naKartu,kVydache});
    }

    if(!data.length){g('panel-salary').innerHTML='<div class="empty">Нет данных</div>';return;}

    let srows=data.map(r=>`
      <div class="sal-r">
        <div style="display:flex;align-items:center">
          <div class="sal-av">${esc(r.name[0]||'?')}</div>
          <div>
            <div class="sal-nm">${esc(r.name)}</div>
            <div class="sal-sub">${r.propuski>0?`Пропусков: ${r.propuski} × €${fv(r.vychet)} = −€${fv(r.itogVychet)}`:'Все смены'}</div>
          </div>
        </div>
        <div style="text-align:right">
          <div class="sal-v">€${fv(r.kVydache)}</div>
          <div class="sal-lb">к выдаче нал</div>
          ${r.naKartu>0?`<div class="sal-sub">На карту: €${fv(r.naKartu)}</div>`:''}
        </div>
      </div>`).join('');

    g('panel-salary').innerHTML=`
      <div class="sg c2">
        <div class="stat"><div class="stat-l">Сотрудников</div><div class="stat-v bl">${data.length}</div></div>
        <div class="stat"><div class="stat-l">ФОТ итого</div><div class="stat-v gr">€${fv(totalZP||data.reduce((s,r)=>s+r.zp,0))}</div></div>
      </div>
      <div class="sg c2">
        <div class="stat"><div class="stat-l">К выдаче нал</div><div class="stat-v bl">€${fv(totalPay||data.reduce((s,r)=>s+r.kVydache,0))}</div></div>
        <div class="stat"><div class="stat-l">Пропусков всего</div><div class="stat-v rd">${data.reduce((s,r)=>s+r.propuski,0)}</div></div>
      </div>
      <div class="sec">Сотрудники</div>
      <div class="card">${srows}</div>`;
  }catch(e){g('panel-salary').innerHTML=`<div class="empty">Ошибка: ${e.message}</div>`;}
}

// ── UTILS ────────────────────────────────────────────────────────
function bgClose(e,id){if(e.target===g(id))g(id).classList.remove('open')}
function spin(t){g('panel-'+t).innerHTML='<div class="loading"><div class="spinner"></div><div class="ltxt">Загрузка...</div></div>'}
function g(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fv(v){const n=parseFloat(String(v||0).replace(',','.'));return isNaN(n)?'0,00':n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function normDate(d){
  if(!d&&d!==0)return'';
  const s=String(d).trim().split(' - ')[0].split(' – ')[0].trim();
  if(/^\d{2}\.\d{2}\.\d{4}$/.test(s))return s;
  if(/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(s)){const p=s.split('.');return p[0].padStart(2,'0')+'.'+p[1].padStart(2,'0')+'.'+p[2];}
  if(typeof d==='number'||/^\d{5}$/.test(s)){const serial=parseInt(s);const dt=new Date((serial-25569)*86400*1000);return String(dt.getUTCDate()).padStart(2,'0')+'.'+String(dt.getUTCMonth()+1).padStart(2,'0')+'.'+dt.getUTCFullYear();}
  return s;
}

// ── SAFE AREA FIX FOR PWA (iPhone Face ID) ───────────────────────
(function fixSafeArea(){
  function apply(){
    // Read actual safe-area-inset-bottom via a test element
    const tester=document.createElement('div');
    tester.style.cssText='position:fixed;bottom:0;left:0;right:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;z-index:-1';
    document.body.appendChild(tester);
    const safeH=tester.offsetHeight||0;
    document.body.removeChild(tester);
    // If env() returned 0 but we're on a notched device, use fallback
    const fallback=(window.screen.height>=812)?34:0;
    const sab=safeH>0?safeH:fallback;
    if(sab>0){
      const bnv=document.querySelector('.bottom-nav');
      const dayB=document.getElementById('dayBar');
      const scr=document.getElementById('scrollArea');
      const BNH=82,BBH=64;
      if(bnv)bnv.style.height=(BNH+sab)+'px';
      if(bnv)bnv.style.paddingBottom=sab+'px';
      if(dayB)dayB.style.bottom=(BNH+sab)+'px';
      if(scr){
        scr.style.bottom=(BNH+sab)+'px';
        scr.classList.contains('with-daybar')&&(scr.style.bottom=(BNH+BBH+sab)+'px');
      }
      // Store for dynamic use
      window._safeBottom=sab;
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply);
  else apply();
  window.addEventListener('resize',apply);
})();

// Override scroll bottom when tab switches to account for day-bar
const _origSwitchTab=switchTab;
switchTab=function(t){
  _origSwitchTab(t);
  const sab=window._safeBottom||0;
  const BNH=82,BBH=64;
  const scr=document.getElementById('scrollArea');
  if(scr){
    const isDay=t==='day';
    scr.style.bottom=isDay?(BNH+BBH+sab)+'px':(BNH+sab)+'px';
  }
};

function applyDarkHeader(isDark){
  const h=g('mainHeader');if(!h)return;
  h.style.cssText='';
  isDark?h.classList.add('header-dark'):h.classList.add('header-light');
  isDark?h.classList.remove('header-light'):h.classList.remove('header-dark');
}
function toggleDark(){
  const isDark=document.body.classList.toggle('dark');
  g('darkBtn').textContent=isDark?'☀️':'🌙';
  applyDarkHeader(isDark);
  try{localStorage.setItem('so_dark',isDark?'1':'0');}catch(e){}
}
function loadDarkMode(){
  const isDark=localStorage.getItem('so_dark')==='1';
  document.body.classList.toggle('dark',isDark);
  applyDarkHeader(isDark);
  const btn=g('darkBtn');if(btn)btn.textContent=isDark?'☀️':'🌙';
}
loadDarkMode();
</script>
